<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>剪纸立体书 · 游乐园</title>
<style>
  :root{
    --ink:#6f5238;
    --paper:#fdf8ee;
    --spread-w:1480px;
    --spread-h:900px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,#f3e9d6 0%,#e2d3b8 55%,#d0bd9c 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center}

  /* 缩放/平移走瞬时 transform：绝不给整块 1480×900 大画布做逐帧 scale 过渡。
     否则每次放大都要把全部 webp/滤镜按新分辨率重采样 1 秒多 → 卡顿 + 图标闪烁。
     入场只做一次轻量 opacity 淡入；不常驻 will-change 超大合成层。 */
  #stage{position:relative;width:var(--spread-w);height:var(--spread-h);
    flex:none;transform-origin:center center;touch-action:none;
    opacity:0;
    transform:translate(var(--panX,0px),var(--panY,0px)) scale(var(--fit,.65));
    transition:opacity .6s ease}
  #stage.in{opacity:1}
  #stage.panning{transition:none}
  html.instant *{transition:none!important;animation-duration:.001s!important}

  #book{position:absolute;inset:0;border-radius:16px;overflow:hidden;
    background:var(--paper);
    box-shadow:0 36px 76px -24px rgba(96,70,40,.55),0 6px 16px rgba(96,70,40,.16);}
  #book::after{content:"";position:absolute;inset:0;border-radius:16px;z-index:60;
    box-shadow:inset 0 0 0 1px rgba(196,170,130,.8);
    background:
      radial-gradient(120% 90% at 50% 120%, rgba(120,92,56,.10), transparent 55%);
    pointer-events:none}

  #sky{position:absolute;inset:0;
    background:linear-gradient(178deg,#d2e7f4 0%,#dde9f1 24%,#eeeade 60%,#fdf3e4 100%)}

  .layer{position:absolute;will-change:transform}
  .layer img{display:block;width:100%;height:100%;pointer-events:none;
    user-select:none;-webkit-user-drag:none}

  /* 远山与中景 */
  #mtnFar {left:50%;transform:translateX(-50%);width:104%;bottom:35.5%;aspect-ratio:1400/787}
  #mtnNear{left:50%;transform:translateX(-50%);width:108%;bottom:30.5%;aspect-ratio:1400/552}
  #midGround{left:50%;transform:translateX(-50%);width:122%;bottom:20%;aspect-ratio:2200/300}

  /* 地面：镜像平铺三份 */
  #groundWrap{left:50%;transform:translateX(-50%);height:48.5%;width:163.6%;bottom:0;
    display:flex}
  #groundWrap img{width:33.3333%;height:100%;flex:none}
  #groundWrap img.flip{transform:scaleX(-1)}

  /* 前景花丛 */
  #flowerWrap{left:-9.459%;width:99.51%;height:27%;bottom:-1%;display:flex}
  #flowerWrap img{width:50%;height:100%;flex:none}
  #flowerWrap img.flip{transform:scaleX(-1)}

  /* ============ 旋转木马 ============ */
  #carousel{left:24.5%;bottom:22.2%;height:56.5%;aspect-ratio:1400/1212;
    transform:translateX(-50%);z-index:20}
  #carBody{position:absolute;inset:0;width:100%;height:100%;z-index:3}
  .horsesBack,.horsesFront{position:absolute;inset:0}
  .horsesBack{z-index:2}
  .horsesFront{z-index:4}
  .horse{position:absolute;left:50%;bottom:11.8%;width:0;height:22.8%;
    transform-origin:50% 100%;will-change:left,bottom,height}
  .horse img{position:absolute;left:0;bottom:0;height:100%;width:auto;
    transform:translateX(-50%);transform-origin:50% 100%}
  .pole{position:absolute;left:0;bottom:0;transform:translateX(-50%);z-index:-1;
    border-radius:2px;background:linear-gradient(90deg,#bb8d51,#f0d9b2 26%,#f8e9cd 52%,#e2bd88 74%,#b8863f)}
  .cap{position:absolute;left:0;bottom:0;transform:translate(-50%,46%);z-index:-1;
    border-radius:2px 2px 40% 40%;
    background:linear-gradient(180deg,#fbe3b0,#eab95f 42%,#d79a3f 78%,#a9762f);
    box-shadow:0 1px 2px rgba(120,80,30,.35)}

  #rideBtn{position:absolute;left:22.5%;bottom:19.4%;transform:translateX(-50%);
    z-index:40;display:flex;align-items:center;gap:9px;padding:10px 20px 10px 16px;
    border:none;border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;
    letter-spacing:.06em;color:#6b4a29;background:linear-gradient(180deg,#fffaef,#f2e1c3);
    box-shadow:0 5px 0 #d3b288,0 10px 20px rgba(120,88,48,.26),inset 0 1px 0 #fffdf7;
    transition:transform .12s,box-shadow .12s}
  #rideBtn:hover{transform:translateX(-50%) translateY(-1px)}
  #rideBtn:active,#rideBtn.on{transform:translateX(-50%) translateY(3px);
    box-shadow:0 2px 0 #d3b288,0 4px 10px rgba(120,88,48,.28),inset 0 1px 0 #fffdf7}
  #rideBtn .ico{width:11px;height:11px;flex:none;border-top:2.5px solid #6b4a29;
    border-right:2.5px solid #6b4a29;transform:rotate(45deg);transform-origin:62% 40%;
    transition:transform .25s}
  #rideBtn.on .ico{transform:rotate(135deg);transform-origin:38% 62%}
  #rideBtn .dot{width:10px;height:10px;border-radius:50%;flex:none;background:#cab49a;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);transition:background .3s,box-shadow .3s}
  #rideBtn.on .dot{background:#e8b04b;box-shadow:0 0 9px #f0c874,inset 0 1px 1px rgba(255,255,255,.7)}

  /* ============ 跷跷板 ============ */
  #seesaw{left:64.5%;bottom:25.8%;width:26%;aspect-ratio:1400/486;
    transform:translateX(-50%);z-index:19}
  #seesawBoard{position:absolute;left:-6.4286%;top:-18.5185%;width:112.857%;
    aspect-ratio:1580/666;transform-origin:50.633% 55.105%;z-index:2;will-change:transform}
  #seesawBoard>img{position:absolute;inset:0;width:100%;height:100%}
  .sBear{position:absolute;transform-origin:50% 100%;will-change:transform;z-index:3}
  #sBearL{left:8.101%;top:calc(13.514% + 2px);width:15.696%;aspect-ratio:248/224}
  #sBearR{left:76.962%;top:calc(15.465% + 2px);width:14.557%;aspect-ratio:230/211}
  .sBear img{display:block;width:100%;height:100%}
  #seesawFrame{position:absolute;inset:0;width:100%;height:100%;z-index:4}
  #seesawHitL,#seesawHitR{position:absolute;top:-16%;bottom:-10%;width:34%;z-index:30;
    cursor:pointer}
  #seesawHitL{left:-6%}
  #seesawHitR{right:-6%}
  #seesawHint{position:absolute;left:50%;bottom:-42%;transform:translateX(-50%);
    font-size:12px;color:#8a7452;letter-spacing:.12em;white-space:nowrap;opacity:0;
    transition:opacity .45s;pointer-events:none;z-index:31}
  #seesaw:hover #seesawHint{opacity:.8}

  /* ============ 秋千 ============ */
  #swing{left:86.8%;bottom:25.9%;height:32%;aspect-ratio:1400/1134;
    transform:translateX(-50%);z-index:18}
  .seat{position:absolute;will-change:transform;cursor:grab;touch-action:none}
  .seat:active{cursor:grabbing}
  .seat img{display:block;width:100%;height:100%;pointer-events:none}
  #seatA{left:30.643%;top:7.496%;width:19%;aspect-ratio:266/895;transform-origin:50.38% 3.02%}
  #seatB{left:52.143%;top:7.496%;width:19%;aspect-ratio:266/895;transform-origin:50.00% 3.02%}
  #swingFrame{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

  /* ============ 小熊 ============ */
  .bear{position:absolute;transform:translateX(-50%);z-index:35;cursor:pointer}
  #bearA{left:45.5%;bottom:4.2%;height:22.5%;aspect-ratio:1400/1397}
  #bearB{left:57.2%;bottom:5.2%;height:19.5%;aspect-ratio:1400/1397}
  .bear img{display:block;width:100%;height:100%;transform-origin:50% 100%;
    transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
  .bear:hover img{transform:translateY(-4px)}
  #balloons{left:42.3%;bottom:19.4%;height:19.5%;aspect-ratio:1400/1381;
    transform:translateX(-50%);z-index:34}
  #balloons img{display:block;width:100%;height:100%;transform-origin:50% 100%}

  /* ============ 选中态：剪纸白边 + 暖光 + 轻微放大 ============ */
  .pickable{transform-origin:50% 86%;
    transition:scale .42s cubic-bezier(.34,1.35,.5,1),filter .3s ease}
  .pickable.picked{
    scale:1.06;
    filter:
      drop-shadow( 2px 0 0 #fff8ea) drop-shadow(-2px 0 0 #fff8ea)
      drop-shadow(0  2px 0 #fff8ea) drop-shadow(0 -2px 0 #fff8ea)
      drop-shadow(0 0 7px rgba(255,190,96,.95))
      drop-shadow(0 13px 18px rgba(112,76,40,.38));
  }

  /* ============ 对话气泡（手剪纸片） ============ */
  .bubble{position:absolute;z-index:50;width:max-content;max-width:336px;
    padding:24px 26px 20px;
    color:#5a422c;
    font-family:"YouYuan","幼圆","Yuanti SC","STYuanti","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:20px;font-weight:500;line-height:1.62;letter-spacing:.025em;
    background:
      repeating-linear-gradient(135deg,rgba(184,150,108,.035) 0 2px,transparent 2px 6px),
      var(--paper);
    border-radius:24px 28px 22px 26px / 26px 22px 28px 24px;
    box-shadow:
      0 0 0 2px #fffdf6,
      0 0 0 4px rgba(214,182,134,.5),
      7px 8px 0 -1px #efd9b2,
      7px 8px 0 0 rgba(196,158,108,.55),
      0 18px 30px -8px rgba(110,80,44,.42);
    opacity:0;transform:translateX(-50%) rotate(1.5deg) scale(.9) translateY(10px);
    transform-origin:50% 100%;cursor:pointer;
    transition:opacity .28s ease,transform .42s cubic-bezier(.34,1.4,.5,1);
    pointer-events:none}
  .bubble.show{opacity:1;pointer-events:auto;
    transform:translateX(-50%) rotate(-1.3deg) scale(1) translateY(0)}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:18px;height:18px;
    margin-left:-9px;background:var(--paper);transform:rotate(45deg);
    border-radius:0 0 5px 0;
    box-shadow:2px 2px 0 0 rgba(214,182,134,.55)}
  .bubble .tag{position:absolute;left:-10px;top:-16px;
    padding:4px 13px 5px;border-radius:999px;
    font-size:13px;letter-spacing:.08em;color:#fffaf0;
    background:linear-gradient(180deg,#e8a75c,#d18c42);
    box-shadow:0 3px 0 #b9792f,0 6px 10px rgba(140,96,44,.3),inset 0 1px 0 rgba(255,255,255,.5);
    transform:rotate(-5deg);white-space:nowrap}
  .bubble .txt{display:block}
  .bubble .foot{display:flex;align-items:center;justify-content:flex-end;
    min-height:27px;margin-top:12px;gap:10px}
  .bubble .next{font-size:13px;color:#b79a72;letter-spacing:.08em;
    opacity:0;transition:opacity .3s;white-space:nowrap}
  .bubble .next.on{opacity:.9}
  .bubble .play{display:none;align-items:center;gap:6px;
    padding:8px 16px 9px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.04em;
    color:#6b4522;background:linear-gradient(180deg,#fff3d4,#f4cf85);
    box-shadow:0 4px 0 #d7a54e,0 8px 14px rgba(150,104,44,.3),inset 0 1px 0 #fffbe9;
    transition:transform .12s,box-shadow .12s;white-space:nowrap}
  .bubble .play.show{display:inline-flex;animation:pop .4s cubic-bezier(.34,1.5,.5,1) both}
  .bubble .play:hover{transform:translateY(-1px)}
  .bubble .play:active{transform:translateY(3px);
    box-shadow:0 1px 0 #d7a54e,0 3px 8px rgba(150,104,44,.32),inset 0 1px 0 #fffbe9}
  .bubble .play i{font-style:normal;font-size:19px;line-height:1;transform:translateY(-1px)}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  /* ============ 主页右上角 · 集星徽标（三个游戏各取最高，合计 15） ============ */
  #topHud{position:fixed;top:14px;right:16px;z-index:150;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  #starBank{position:relative;min-width:186px;padding:10px 14px 11px;cursor:pointer;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    border-radius:16px 18px 15px 17px;border:2px solid #fffaf0;
    background:linear-gradient(180deg,#fffaef,#f1e0c0);
    box-shadow:0 4px 0 #d3b288,0 9px 18px rgba(120,88,48,.26),inset 0 1px 0 #fffdf7;
    user-select:none;-webkit-user-select:none;transition:transform .12s}
  #starBank:active{transform:translateY(2px)}
  #starBank .sbHead{display:flex;align-items:center;gap:8px}
  #starBank .sbStar{width:26px;height:26px;flex:none;
    filter:drop-shadow(0 2px 2px rgba(180,120,40,.35))}
  #starBank .sbNum{font-size:14px;font-weight:700;color:#a4885c;line-height:1;white-space:nowrap}
  #starBank .sbNum b{font-size:23px;color:#c07f24}
  #starBank .sbTitle{font-size:11px;color:#9a7c52;letter-spacing:.06em;
    margin-left:auto;white-space:nowrap}
  #starBank .sbBar{display:flex;gap:2px;margin-top:9px}
  #starBank .sbBar u{flex:1;height:7px;border-radius:3px;background:#e2d2b4;text-decoration:none;
    box-shadow:inset 0 1px 1px rgba(120,90,50,.14)}
  #starBank .sbBar u.on{background:linear-gradient(180deg,#ffd569,#f0a92e);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  #starBank .sbDetail{display:none;margin-top:10px;padding-top:8px;
    border-top:1.5px dashed rgba(190,160,120,.6)}
  #starBank.open .sbDetail{display:block}
  #starBank .sbRow{display:flex;align-items:center;gap:7px;margin:4px 0;
    font-size:11.5px;color:#8a6f4a}
  #starBank .sbRow span{width:50px;flex:none}
  #starBank .sbRow em{display:flex;gap:3px;font-style:normal}
  #starBank .sbRow em svg{width:13px;height:13px}
  #starBank .sbRow b{margin-left:auto;color:#a97f42;font-size:11px;font-weight:700}
  #starBank .sbTip{font-size:10px;color:#b0906a;text-align:center;
    margin-top:8px;letter-spacing:.02em}
  #starBank.full{background:linear-gradient(180deg,#fff3cf,#ffe1a0);
    border-color:#fff6dc;
    box-shadow:0 4px 0 #d9a449,0 9px 22px rgba(224,160,40,.5),inset 0 1px 0 #fff8e0;
    animation:sbGlow 1.7s ease-in-out infinite}
  #starBank.full .sbNum b{color:#b56a12}
  @keyframes sbGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.07)}}
  #topHud #sndBtn{position:static}

  /* 满星奖励 · 蜂蜜罐贴纸（挂在对话气泡上） */
  .bubble .gift{display:none;position:absolute;right:-16px;top:-24px;width:58px;height:58px;
    filter:drop-shadow(0 5px 7px rgba(120,80,30,.35));transform:rotate(12deg);
    animation:pop .5s cubic-bezier(.34,1.5,.5,1) both}
  .bubble.hasGift .gift{display:block}

  #hint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:99;pointer-events:none;
    font-size:12.5px;color:#6d5436;letter-spacing:.16em;white-space:nowrap;opacity:.9}
  #rotateTip{position:fixed;left:50%;top:14px;transform:translateX(-50%);
    font-size:12.5px;color:#7a5a34;letter-spacing:.08em;opacity:0;transition:opacity .4s;
    pointer-events:none;z-index:99;padding:7px 14px;border-radius:999px;
    background:rgba(255,250,238,.92);box-shadow:0 2px 10px rgba(120,88,48,.22);
    white-space:nowrap}
  #rotateTip.hot{pointer-events:auto;cursor:pointer}
  @media (max-width:520px){
    /* 窄屏：徽标与提示条同在顶部会重叠，把提示条下移到徽标下方 */
    #rotateTip{top:auto;bottom:46px;font-size:11.5px}
  }

  /* ---------- 视图缩放控件：左上角竖排，手机放大阅读 / 横屏入口 ---------- */
  #viewBar{position:fixed;left:12px;top:12px;z-index:150;
    display:flex;flex-direction:column;align-items:stretch;gap:7px;
    background:rgba(255,250,238,.9);border-radius:16px;padding:8px;
    box-shadow:0 0 0 2px #fffdf6,0 0 0 3.5px rgba(214,182,134,.55),0 8px 18px rgba(110,80,44,.24)}
  #viewBar button{border:none;cursor:pointer;font-family:inherit;
    width:40px;height:34px;border-radius:10px;font-size:15px;font-weight:700;color:#6b4a29;
    background:linear-gradient(180deg,#fffaef,#f0e2c8);
    box-shadow:0 2.5px 0 #d3b288,0 5px 10px rgba(120,88,48,.2),inset 0 1px 0 #fffdf7}
  #viewBar button:active{transform:translateY(2px);box-shadow:0 1px 0 #d3b288}
  #viewBar #vRot{width:auto;padding:0 9px;font-size:12px;font-weight:600;white-space:nowrap}
  #vPct{font-size:11.5px;font-weight:700;color:#a4885c;text-align:center;line-height:1}

  /* ============ 旋转木马 · 骑乘游戏 ============ */
  #game{position:fixed;inset:0;z-index:200;display:none;overflow:hidden;
    background:linear-gradient(180deg,#d5e9f6 0%,#e9eee9 46%,#f3ead6 56%,#d9e6bd 100%);
    font-family:"YouYuan","幼圆","Yuanti SC","STYuanti","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  #game.on{display:block;animation:gFade .5s ease both}
  html.instant #game.on{animation:none}
  @keyframes gFade{from{opacity:0}to{opacity:1}}

  #gRide{position:absolute;inset:-6%;transform-origin:50% 62%;will-change:transform}
  /* 镜头层：整幅场景随玩家所在列反向平移，让「我这一列」始终对准画面中央，马头保持居中 */
  #gCam{position:absolute;inset:0;will-change:transform}
  #gSky{position:absolute;inset:0;
    background:radial-gradient(90% 60% at 50% 16%,rgba(255,255,255,.75),transparent 72%)}
  .gHill{position:absolute;border-radius:50% 50% 0 0/100% 100% 0 0;
    box-shadow:inset 0 4px 0 rgba(255,255,255,.85)}
  #gHill1{left:-16%;width:74%;height:38%;top:26%;background:#e7ddc1}
  #gHill2{right:-14%;width:82%;height:44%;top:22%;background:#dfe6c8}
  #gHill3{left:18%;width:70%;height:26%;top:38%;background:#ccdcb3}
  #gGround{position:absolute;left:-42%;right:-42%;top:55%;bottom:-25%;
    border-radius:50% 50% 0 0/10% 10% 0 0;
    background:
      repeating-radial-gradient(circle at 50% 0%,rgba(255,255,255,.17) 0 3px,transparent 3px 48px),
      linear-gradient(180deg,#dbe9be,#bdd89c 62%,#a8c888);
    box-shadow:inset 0 5px 0 rgba(255,255,255,.65)}
  #gRails{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* 三条车道：当前列亮起奶白纸路 */
  .gLane{fill:rgba(255,252,240,0);transition:fill .3s ease}
  .gLane.on{fill:rgba(255,252,240,.46)}
  #gWorld{position:absolute;inset:0;pointer-events:none}
  /* 脚下投影：跟着跑道走，升得越高越小越淡 */
  #gShadow{position:absolute;left:50%;bottom:4.5%;width:21%;aspect-ratio:2.7/1;
    transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:9;
    background:radial-gradient(50% 50% at 50% 50%,rgba(92,68,36,.55),rgba(92,68,36,0) 72%);
    will-change:opacity,transform}

  /* 障碍的固定大小坐标牌：不随透视缩放，始终能读出「哪一列 · 什么点心」 */
  .gObsTag{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px 14px 11px 13px;
    white-space:nowrap;background:rgba(255,250,238,.94);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 3.5px rgba(214,182,134,.6),0 6px 12px rgba(110,80,44,.25)}
  .gObsTag b{font-size:13px;font-weight:700;color:#a8412a}
  .gObsTag span{font-size:11px;color:#8a7150}
  /* 窄屏竖屏：坐标牌去描述文字并限宽，避免溢出屏幕右缘 */
  @media (max-width:700px){
    .gObsTag{max-width:46vw;overflow:hidden}
    .gObsTag span{display:none}
    .gObsTag b{font-size:11.5px}
  }
  /* 障碍：小巧鲜明的剪纸片。left/top 只在生成时设一次，运行期只用 transform/opacity
     更新（消除每帧强制重排）。去掉每片 drop-shadow 滤镜：transform 每帧变化时不再重算滤镜，
     立体感由 SVG 自带白色描边负责。尺寸由 JS 注入 --obsPx。 */
  .gObs{position:absolute;width:var(--obsPx,11%);aspect-ratio:1;transform-origin:50% 50%;
    pointer-events:none;top:0;left:0}
  .gObs .art{position:absolute;left:50%;top:50%;width:100%;height:100%;
    transform:translate(-50%,-50%)}
  .gObs.donut .art{transform:translate(-50%,-50%) scale(.9)}
  .gObs.stack{width:calc(var(--obsPx, 11%) * .74)}   /* 两格各一个独立小点心，略缩小让层与层清晰分开 */
  .gObs svg{display:block;width:100%;height:100%}

  /* 马头的当前坐标贴纸：直接写明我在哪一格 */
  #gMe{position:absolute;left:50%;bottom:40%;z-index:12;pointer-events:none;
    transform:translateX(-50%) rotate(-1.5deg);white-space:nowrap;
    padding:6px 14px;border-radius:14px 16px 13px 15px;
    font-size:14px;font-weight:600;color:#6b4522;
    background:linear-gradient(180deg,#fffaf0,#f7e7c9);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.5),0 6px 12px rgba(110,80,44,.22)}
  #gMe b{color:#e0912e;font-weight:800}

  /* 第一人称马头 */
  #gHorse{position:absolute;left:50%;bottom:-3%;width:min(40%,440px);
    transform:translateX(-50%);z-index:10;pointer-events:none;
    filter:drop-shadow(0 -4px 12px rgba(90,66,40,.3));will-change:transform}
  #gHorse svg{display:block;width:100%;height:auto}

  /* 高度计：竖排三点，当前层点亮 */
  #gMeter{position:absolute;left:22px;top:50%;transform:translateY(-50%);z-index:12;
    display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 9px;
    border-radius:999px;background:rgba(255,250,238,.82);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.5),0 8px 18px rgba(110,80,44,.22)}
  #gMeter::before,#gMeter::after{font-size:11px;line-height:1;color:#9a8261;letter-spacing:1px}
  #gMeter::before{content:'高';margin-bottom:-3px}
  #gMeter::after{content:'低';margin-top:-3px}
  #gMeter i{width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.6);
    box-shadow:inset 0 0 0 1.5px rgba(200,172,130,.55);
    transition:transform .18s,box-shadow .18s,background .18s}
  #gMeter i.on{background:linear-gradient(180deg,#f6c46a,#e39a3f);transform:scale(1.22);
    box-shadow:0 0 0 2px #fff8e8,0 0 14px 5px rgba(255,240,190,.85),0 3px 6px rgba(150,100,40,.4)}
  /* 换列 / 升降时浮现的方向箭头 */
  #gHint{position:absolute;left:50%;bottom:31%;z-index:14;pointer-events:none;opacity:0;
    font-size:48px;font-weight:700;color:#e0912e;transform:translateX(-50%);
    text-shadow:-3px 0 0 #fffdf4,3px 0 0 #fffdf4,0 -3px 0 #fffdf4,0 3px 0 #fffdf4,
      -2px -2px 0 #fffdf4,2px 2px 0 #fffdf4,2px -2px 0 #fffdf4,-2px 2px 0 #fffdf4,
      0 7px 14px rgba(150,100,40,.3)}
  #gHint.pop{animation:hintPop .6s ease-out both}
  @keyframes hintPop{
    0%{opacity:0;transform:translate(-50%,12px) scale(.5)}
    18%{opacity:1;transform:translate(-50%,0) scale(1.18)}
    42%{opacity:1;transform:translate(-50%,-6px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-38px) scale(.92)}}

  /* HUD */
  #gHud{position:absolute;left:0;right:0;top:0;padding:18px 24px;z-index:12;
    display:flex;align-items:center;gap:18px}
  #gStars{display:flex;gap:6px}
  #gStars svg{width:32px;height:32px;filter:drop-shadow(0 3px 3px rgba(120,88,44,.3))}
  #gStars svg.lit{animation:starPop .55s cubic-bezier(.34,1.5,.5,1) both}
  @keyframes starPop{0%{transform:scale(.3) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
  #gTime{margin-left:auto;font-size:19px;letter-spacing:.08em;color:#6b5638;white-space:nowrap;
    background:rgba(255,250,238,.85);padding:7px 17px;border-radius:999px;
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.5),0 6px 14px rgba(110,80,44,.2)}
  #gExit{padding:8px 17px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:15px;color:#6b4a29;
    background:linear-gradient(180deg,#fffaef,#f0e2c8);
    box-shadow:0 4px 0 #d3b288,0 8px 14px rgba(120,88,48,.24),inset 0 1px 0 #fffdf7}
  #gExit:active{transform:translateY(3px)}
  /* 暂停按钮：与返回/音乐同一排，暂停态换成「继续」+ 播放图标 */
  .gPauseBtn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border:none;
    border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;color:#6b4a29;
    background:linear-gradient(180deg,#fffaef,#f0e2c8);
    box-shadow:0 4px 0 #d3b288,0 8px 14px rgba(120,88,48,.24),inset 0 1px 0 #fffdf7;
    transition:transform .12s,filter .18s}
  .gPauseBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d3b288}
  .gPauseBtn svg{width:15px;height:15px;flex:none}
  .gPauseBtn .icoPlay{display:none}
  .gPauseBtn.paused .icoPause{display:none}
  .gPauseBtn.paused .icoPlay{display:block}
  .gPauseBtn.paused{background:linear-gradient(180deg,#fff3d4,#f4cf85);
    box-shadow:0 4px 0 #d7a54e,0 8px 14px rgba(150,104,44,.3),inset 0 1px 0 #fffbe9}
  .gPauseStat{font-size:14px;color:#8a7150;background:rgba(255,250,238,.7);
    border-radius:12px;padding:9px 14px;margin:0 0 18px;
    box-shadow:inset 0 0 0 1px rgba(214,182,134,.5)}

  /* 3×3 位置格板：行列都有坐标，一眼读出「我」和「点心」各占哪格 */
  #gGrid{position:absolute;right:18px;bottom:18px;z-index:12;
    display:grid;grid-template-columns:22px repeat(3,34px);
    grid-template-rows:18px repeat(3,34px) auto;gap:5px;padding:11px 12px;
    border-radius:18px;background:rgba(255,250,238,.88);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.5),0 8px 18px rgba(110,80,44,.22)}
  .gAx{display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#9a8261;letter-spacing:.04em}
  .gAx.on{color:#e0912e;font-weight:800;text-shadow:0 0 8px rgba(246,196,106,.8)}
  #gGrid b{position:relative;display:flex;align-items:center;justify-content:center;
    border-radius:9px;background:rgba(255,255,255,.6);
    box-shadow:inset 0 0 0 1px rgba(200,172,130,.5);
    font-size:16px;font-weight:700;color:#fff}
  #gGrid b.mycol{background:rgba(255,240,200,.9)}
  #gGrid b.mylane{background:rgba(255,246,222,.85)}   /* 当前行：与「列」对称的选中高亮 */
  #gGrid b.danger{background:rgba(226,126,92,.72)}
  #gGrid b.danger::after{content:'✕';color:#fff;text-shadow:0 1px 2px rgba(150,60,30,.6)}
  #gGrid b.me{background:linear-gradient(180deg,#f6c46a,#e39a3f);
    box-shadow:0 0 0 2px #fff8e8,0 3px 6px rgba(150,100,40,.4)}
  #gGrid b.me::after{content:'我';font-size:15px;color:#7a4a18;text-shadow:0 1px 0 #fff3d0}
  #gGrid b.me.danger{box-shadow:0 0 0 2px #fff8e8,0 0 0 4px rgba(224,86,56,.9),0 3px 6px rgba(150,100,40,.4)}
  #gGrid b.me.danger::after{content:'!';color:#a8412a;text-shadow:0 1px 0 #fff3d0}
  .gGridKey{grid-column:1/-1;text-align:center;font-size:10.5px;color:#9a8261;
    padding-top:2px;white-space:nowrap}

  /* 躲避计数 */
  #gDodged{font-size:14px;letter-spacing:.03em;color:#7a6240;white-space:nowrap;
    background:rgba(255,250,238,.82);padding:7px 14px;border-radius:999px;
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.45)}
  #gDodged b{font-size:18px;color:#e0912e;margin-left:3px}

  /* 逼近预警：屏幕边缘泛红，越近越亮 */
  #gWarn{position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;
    background:radial-gradient(125% 88% at 50% 54%,transparent 48%,rgba(222,88,58,.68) 100%);
    transition:opacity .14s}
  #gWarn.pulse{animation:warnPulse .68s ease-in-out infinite}
  @keyframes warnPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}

  /* 中央操作提示：现在安不安全、该按哪个键 */
  #gCue{position:absolute;left:50%;top:76px;z-index:13;pointer-events:none;
    display:flex;align-items:center;gap:9px;padding:9px 19px;border-radius:999px;
    font-size:16px;font-weight:600;white-space:nowrap;color:#6b4522;
    opacity:0;transform:translate(-50%,-9px);transition:opacity .18s,transform .18s;
    background:linear-gradient(180deg,#fffaf0,#f3e6cd);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(214,182,134,.5),0 10px 22px rgba(110,80,44,.25)}
  #gCue.on{opacity:1;transform:translate(-50%,0)}
  #gCue .cueIco{font-size:23px;line-height:1;font-weight:700}
  #gCue.safe{color:#4e7032;background:linear-gradient(180deg,#f3fbe8,#e2f0cc);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(148,190,108,.6),0 10px 22px rgba(80,110,44,.22)}
  #gCue.danger{color:#a83e26;background:linear-gradient(180deg,#fff0e5,#ffd7c1);
    box-shadow:0 0 0 2px #fffdf6,0 0 0 4px rgba(224,96,64,.62),0 10px 24px rgba(160,60,32,.32);
    animation:cueShake .5s ease-in-out infinite}
  @keyframes cueShake{0%,100%{margin-left:0}25%{margin-left:-3px}75%{margin-left:3px}}
  #gTouch button.cue{background:linear-gradient(180deg,#fff0d4,#f8c674);
    box-shadow:0 0 0 3px #fff8e8,0 0 0 6px rgba(226,140,58,.72),0 4px 0 #d3b288,0 8px 16px rgba(120,88,48,.3)}

  /* 躲过瞬间：金色涟漪 + 飘字 */
  #gRing{position:absolute;left:50%;bottom:8%;width:32%;aspect-ratio:2.6/1;z-index:11;
    pointer-events:none;opacity:0;border-radius:50%;transform:translateX(-50%) scale(.35);
    border:6px solid rgba(255,212,116,.92);
    box-shadow:0 0 24px rgba(255,200,100,.7),inset 0 0 20px rgba(255,220,140,.6)}
  #gRing.go{animation:ringGo .6s ease-out}
  @keyframes ringGo{0%{opacity:.9;transform:translateX(-50%) scale(.35)}
    100%{opacity:0;transform:translateX(-50%) scale(1.5)}}
  #gPop{position:absolute;inset:0;z-index:14;pointer-events:none}
  #gPop span{position:absolute;left:50%;bottom:27%;white-space:nowrap;
    font-size:27px;font-weight:700;color:#e0912e;transform:translateX(-50%);
    text-shadow:-3px 0 0 #fffdf4,3px 0 0 #fffdf4,0 -3px 0 #fffdf4,0 3px 0 #fffdf4,
      -2px -2px 0 #fffdf4,2px 2px 0 #fffdf4,2px -2px 0 #fffdf4,-2px 2px 0 #fffdf4,
      0 7px 14px rgba(150,100,40,.3);
    animation:popUp .9s ease-out both}
  #gPop span.clutch{color:#d8643c;font-size:30px}
  @keyframes popUp{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}
    16%{opacity:1;transform:translate(-50%,0) scale(1.16)}
    60%{opacity:1}100%{opacity:0;transform:translate(-50%,-54px) scale(1)}}
  html.instant #gPop span{animation:none!important;opacity:1!important;
    transform:translate(-50%,-14px)!important}
  html.instant #gRing.go{animation:none!important;opacity:.85!important;
    transform:translateX(-50%) scale(.95)!important}
  html.instant #gCue,html.instant #gWarn{transition:none!important}

  #gFlash{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 72%,rgba(255,255,255,.92),rgba(240,150,110,.5) 60%,transparent 80%)}
  #gFlash.hit{animation:gHit .55s ease-out}
  @keyframes gHit{0%{opacity:.95}100%{opacity:0}}

  /* 触屏方向键 */
  #gTouch{position:absolute;left:0;right:0;bottom:16px;z-index:13;display:none;
    justify-content:space-between;padding:0 20px;pointer-events:none}
  .gPad{display:flex;gap:12px;pointer-events:none}
  #gTouch button{pointer-events:auto;width:60px;height:60px;border:none;border-radius:50%;
    font-family:inherit;font-size:30px;line-height:1;color:#6b4a29;cursor:pointer;
    background:linear-gradient(180deg,#fffaef,#f2e1c3);
    box-shadow:0 4px 0 #d3b288,0 8px 16px rgba(120,88,48,.28),inset 0 1px 0 #fffdf7}
  #gTouch button:active{transform:translateY(3px);box-shadow:0 1px 0 #d3b288}
  @media (max-width:820px),(pointer:coarse){#gTouch{display:flex}}
  @media (max-width:640px){
    #gHud{padding:12px 14px;gap:10px}
    #gStars{gap:4px}
    #gStars svg{width:24px;height:24px}
    #gTime{font-size:14px;padding:6px 12px;letter-spacing:.04em}
    #gExit{padding:6px 12px;font-size:13px}
    .gPauseBtn{padding:6px 11px;font-size:13px}
    .gPauseBtn .pzLabel{display:none}
    #gHud{flex-wrap:wrap}
    #gGrid{right:12px;bottom:100px;padding:8px 9px;gap:4px;
      grid-template-columns:18px repeat(3,24px);grid-template-rows:15px repeat(3,24px) auto}
    #gGrid b{font-size:13px}
    .gAx{font-size:10px}
    .gGridKey{font-size:9px}
    #gMe{font-size:12px;padding:5px 10px;bottom:40%}
    .gObsTag{padding:4px 8px}
    .gObsTag b{font-size:11px}
    .gObsTag span{font-size:10px}
    #gMeter{left:10px;padding:9px 7px;gap:7px}
    #gMeter i{width:15px;height:15px}
    #gLaneBand{width:130%}      /* 光带高度由 JS 随视口注入，不按方向覆盖 */
    .sndBtn{font-size:12px;padding:6px 11px}
    #topHud{top:10px;right:10px}
    #starBank{min-width:158px;padding:8px 11px 9px}
    #starBank .sbStar{width:22px;height:22px}
    #starBank .sbNum b{font-size:20px}
    #starBank .sbTitle{font-size:10px}
    #gHint{font-size:40px}
    #gDodged{font-size:12px;padding:5px 10px}
    #gDodged b{font-size:14px}
    #gCue{top:62px;font-size:14px;padding:7px 13px}
    #gCue .cueIco{font-size:19px}
    #gPop span{font-size:22px}
    #gTouch{bottom:12px}
    #gTouch button{width:52px;height:52px;font-size:26px}
    .gCard{padding:22px 18px}
    .gCard h2{font-size:22px}
    .gCard p{font-size:13.5px}
    .gLegend{gap:7px}
    .gLegend svg{width:38px;height:38px}
    .gLegend .pics svg{width:31px;height:31px;margin:0 -2px}
    .gLegend b{font-size:13px}
    .gLegend span{font-size:11px}
    .gBtn{font-size:16px;padding:10px 20px}
  }

  /* 开始 / 结算面板 */
  #gPanel{position:absolute;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;background:rgba(60,44,28,.3)}
  #gPanel.on{display:flex}
  .gCard{width:min(90%,570px);min-width:0;max-height:92%;overflow:auto;padding:30px 34px 28px;
    text-align:center;transform:rotate(-.6deg);
    background:repeating-linear-gradient(135deg,rgba(184,150,108,.035) 0 2px,transparent 2px 6px),var(--paper);
    border-radius:26px 30px 24px 28px/28px 24px 30px 26px;
    box-shadow:0 0 0 2px #fffdf6,0 0 0 5px rgba(214,182,134,.5),
      9px 10px 0 -1px #efd9b2,9px 10px 0 0 rgba(196,158,108,.5),
      0 26px 50px -12px rgba(80,58,32,.5)}
  .gCard h2{margin:0 0 6px;font-size:28px;font-weight:600;color:#6b4522;letter-spacing:.04em}
  .gCard p{margin:0 0 16px;font-size:15px;line-height:1.7;color:#8a7150}
  .gLegend{display:flex;gap:10px;justify-content:center;margin:14px 0 18px}
  .gLegend>div{flex:1;min-width:0;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.62);
    box-shadow:inset 0 0 0 1px rgba(214,182,134,.55)}
  .gLegend svg{width:48px;height:48px;display:block;margin:0 auto 6px}
  .gLegend .pics{display:flex;justify-content:center;align-items:center;margin:0 auto 6px}
  .gLegend .pics svg{width:40px;height:40px;margin:0 -3px}
  .gLegend b{display:block;font-size:15px;color:#6b4522}
  .gLegend span{display:block;font-size:12.5px;color:#a08460;margin-top:2px;word-break:break-word}
  .gBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .gBtn{padding:12px 26px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:18px;font-weight:600;color:#6b4522;
    background:linear-gradient(180deg,#fff3d4,#f4cf85);
    box-shadow:0 4px 0 #d7a54e,0 9px 16px rgba(150,104,44,.3),inset 0 1px 0 #fffbe9;
    transition:transform .12s}
  .gBtn.ghost{background:linear-gradient(180deg,#fffaef,#efe4cd);
    box-shadow:0 4px 0 #d3b288,0 9px 16px rgba(120,88,48,.24),inset 0 1px 0 #fffdf7}
  .gBtn:active{transform:translateY(3px)}
  .gStarsBig{display:flex;gap:8px;justify-content:center;margin:12px 0 18px}
  .gStarsBig svg{width:46px;height:46px}

  /* ---------- 声音开关：书页右上 + 游戏 HUD 各一枚，状态同步 ---------- */
  .sndBtn{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;color:#6b4a29;
    padding:8px 15px;border-radius:999px;
    background:linear-gradient(180deg,#fffaef,#f0e2c8);
    box-shadow:0 4px 0 #d3b288,0 8px 14px rgba(120,88,48,.24),inset 0 1px 0 #fffdf7;
    transition:transform .12s,filter .18s}
  .sndBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d3b288}
  .sndBtn svg{width:16px;height:16px;flex:none}
  .sndBtn .mute{display:none}
  .sndBtn.off{filter:grayscale(.6);opacity:.78}
  .sndBtn.off .note{display:none}
  .sndBtn.off .mute{display:block}
  #sndBtn{position:fixed;top:14px;right:16px;z-index:150}

  /* ---------- 当前高度层的「选中」奶白光带：与左中右跑道白阴影对称。
     只有当前层这一条：奶白柔光 + 上下白色虚线（呼应跑道虚线），不做成三层背景 ---------- */
  #gLaneBand{position:absolute;left:50%;top:53%;width:min(74%,860px);height:var(--bandH,15%);
    transform:translate(-50%,-50%);border-radius:20px;pointer-events:none;
    background:radial-gradient(55% 62% at 50% 50%,
      rgba(255,252,240,.8) 0%,rgba(255,252,240,.5) 46%,rgba(255,252,240,0) 80%);
    border-top:2.5px dashed rgba(255,255,255,.9);
    border-bottom:2.5px dashed rgba(255,255,255,.9);will-change:transform}

  /* ============ 跷跷板 · 快速配平游戏 ============ */
  #ss{position:fixed;inset:0;z-index:210;display:none;overflow:hidden;
    background:linear-gradient(180deg,#d5e9f6 0%,#e9eee9 46%,#f3ead6 56%,#d9e6bd 100%);
    font-family:"YouYuan","幼圆","Yuanti SC","STYuanti","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #ss.on{display:block;animation:gFade .5s ease both}
  html.instant #ss.on{animation:none}
  #ssHill1{left:-16%;width:74%;height:32%;top:32%;background:#e7ddc1}
  #ssHill2{right:-14%;width:82%;height:38%;top:28%;background:#dfe6c8}
  #ssHill3{left:18%;width:70%;height:20%;top:42%;background:#ccdcb3}
  #ssGround{position:absolute;left:-8%;right:-8%;top:66%;bottom:-14%;
    border-radius:50% 50% 0 0/10% 10% 0 0;
    background:
      repeating-radial-gradient(circle at 50% 0%,rgba(255,255,255,.17) 0 3px,transparent 3px 44px),
      linear-gradient(180deg,#dbe9be,#bdd89c 62%,#a8c888);
    box-shadow:inset 0 5px 0 rgba(255,255,255,.65)}

  /* 跷跷板主体：复用书页素材与支点比例，板随失衡旋转 */
  #ssStage{position:absolute;left:50%;top:60%;width:min(74%,980px);aspect-ratio:1400/486;
    transform:translate(-50%,-50%)}
  #ssShadow{position:absolute;left:50%;bottom:-15%;width:78%;height:15%;
    transform:translateX(-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,rgba(92,68,36,.42),rgba(92,68,36,0) 72%);
    will-change:transform}
  #ssBoard{position:absolute;left:-6.4286%;top:-18.5185%;width:112.857%;aspect-ratio:1580/666;
    transform-origin:50.633% 55.105%;z-index:2;will-change:transform}
  #ssBoard>img{position:absolute;inset:0;width:100%;height:100%}
  .ssBear{position:absolute;transform-origin:50% 100%;will-change:transform;z-index:3}
  #ssBearL{left:8.101%;top:calc(13.514% + 2px);width:15.696%;aspect-ratio:248/224}
  #ssBearR{left:76.962%;top:calc(15.465% + 2px);width:14.557%;aspect-ratio:230/211}
  .ssBear img{display:block;width:100%;height:100%}

  /* ============ 秋千 · 荡高投掷游戏 ============ */

  /* 落地旗：插在玩偶落点，写米数与评级 */
  #swFlag{position:absolute;top:78%;display:none;pointer-events:none;z-index:5}

  #swStage{position:absolute;z-index:2;pointer-events:none}

  #swFrame{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
  /* 飞行/坠落中的玩偶（面朝右的侧坐小熊，与飞行方向一致） */
  #swFly{position:absolute;z-index:6;display:none;will-change:left,top,transform}

    filter:drop-shadow(0 8px 10px rgba(90,66,40,.3))}

  /* HUD */
  #swHud{position:absolute;left:0;right:0;top:0;padding:18px 24px;z-index:30;

  #swExit{padding:8px 17px;border:none;border-radius:999px;cursor:pointer;

  /* 高度/能量计：竖条充能，顶部红虚线以上是危险区 */
  #swPower{position:absolute;left:22px;top:50%;transform:translateY(-50%);z-index:30;

  #swPanel{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);

const stage = $('stage'), carousel = $('carousel'), carBody = $('carBody');
const hBack = $('horsesBack'), hFront = $('horsesFront');
const rideBtn = $('rideBtn'), rideLbl = $('rideLabel');
const sBoard = $('seesawBoard'), sBearL = $('sBearL'), sBearR = $('sBearR');
const balloons = $('balloons');

/* ---------- 声音：Web Audio 程序化合成。零素材、file:// 双击可用；
   截图 / 自检等自动化态（#hash 带调试字样）完全静默，绝不影响无头验证 ---------- */
const SND_AUTO = /(selftest|shot|game|ss|sw)/.test(location.hash);
const MELODY = [659,784,880,0, 784,659,587,0, 587,659,784,0, 659,587,523,0,
                659,784,880,1047, 880,784,659,0, 523,587,659,784, 659,587,523,0];
const ROOT   = [262,262,196,220, 262,262,175,196];    /* 每 4 拍一个低音垫 */
const Snd = {
  ac:null, master:null, timer:null, mood:'calm', on:true, i:0, nextT:0, calls:0,
  ensure(){                      /* 首次用户手势解锁 AudioContext（浏览器自动播放策略） */
    if(SND_AUTO || this.ac || !this.on) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ this.on = false; return; }
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = .9;
      this.master.connect(this.ac.destination);
      if(this.ac.state === 'suspended') this.ac.resume().catch(()=>{});
      this.nextT = this.ac.currentTime + .15;
      this.timer = setInterval(()=>this.tick(), 40);
    }catch(e){ this.ac = null; }
  },
  tick(){                        /* BGM 前瞻调度：五声音阶八音盒小旋律循环 */
    if(!this.ac || !this.on) return;
    const beat = this.mood === 'play' ? .30 : .38;
    try{
      while(this.nextT < this.ac.currentTime + .15){
        this.melody(this.i++, this.nextT, beat);
        this.nextT += beat;
      }
    }catch(e){}
  },
  melody(i, t, beat){
    const f = MELODY[i % MELODY.length];
    if(f){
      this.note(f, t, beat*1.8, .05, 'triangle', true);
      if(i % 4 === 0) this.note(ROOT[(i/4|0) % ROOT.length], t, beat*4.6, .024, 'sine');
    }
  },
  note(f, t, dur, vol, type, sparkle, glide){
    const c = this.ac, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    o.connect(g); g.connect(this.master);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + .016);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .05);
    if(sparkle){                 /* 高八度泛音 → 八音盒的「叮」感 */
      const o2 = c.createOscillator(), g2 = c.createGain();
      o2.type = 'sine'; o2.frequency.value = f*2;
      o2.connect(g2); g2.connect(this.master);
      g2.gain.setValueAtTime(.0001, t);
      g2.gain.linearRampToValueAtTime(vol*.32, t + .01);
      g2.gain.exponentialRampToValueAtTime(.0001, t + dur*.55);
      o2.start(t); o2.stop(t + dur*.55 + .05);
    }
  },
  seq(list){                     /* 音效：一组短音 [{f,at,dur,vol,type,glide}] */
    if(!this.ac || !this.on) return;
    const t0 = this.ac.currentTime + .01;
    for(const n of list) this.note(n.f, t0 + (n.at||0), n.dur||.16,
      n.vol||.16, n.type||'triangle', false, n.glide);
  },
  sfx(name){                     /* 事件音效入口：无上下文时静默计数，绝不抛错 */
    this.calls++;
    if(!this.ac || !this.on) return;
    try{
      switch(name){
        case 'tap':    this.seq([{f:880,dur:.09,vol:.09}]); break;
        case 'bubble': this.seq([{f:660,dur:.1,vol:.08},{f:880,at:.07,dur:.12,vol:.08}]); break;
        case 'select': this.seq([{f:523,dur:.1,vol:.11},{f:784,at:.08,dur:.15,vol:.11}]); break;
        case 'spin':   this.seq([{f:392,dur:.3,vol:.12,type:'sine'},{f:523,at:.1,dur:.3,vol:.11,type:'sine'},{f:659,at:.2,dur:.4,vol:.11,type:'sine'}]); break;
        case 'seesaw': this.seq([{f:180,dur:.2,vol:.2,type:'sine'},{f:262,at:.1,dur:.26,vol:.11}]); break;
        case 'swing':  this.seq([{f:500,dur:.45,vol:.09,type:'sine',glide:820}]); break;
        case 'start':  this.seq([{f:523,dur:.13,vol:.13},{f:659,at:.09,dur:.13,vol:.13},{f:784,at:.18,dur:.2,vol:.14},{f:1047,at:.3,dur:.32,vol:.13}]); break;
        case 'move':   this.seq([{f:740,dur:.07,vol:.06},{f:988,at:.05,dur:.09,vol:.05}]); break;
        case 'warn':   this.seq([{f:622,dur:.13,vol:.1},{f:554,at:.13,dur:.17,vol:.1}]); break;
        case 'dodge':  this.seq([{f:784,dur:.1,vol:.12},{f:1047,at:.07,dur:.15,vol:.12},{f:1319,at:.14,dur:.22,vol:.1}]); break;
        case 'star':   this.seq([{f:1047,dur:.13,vol:.12},{f:1319,at:.09,dur:.24,vol:.11}]); break;
        case 'fail':   this.seq([{f:330,dur:.2,vol:.15,type:'sine'},{f:262,at:.15,dur:.26,vol:.14,type:'sine'},{f:196,at:.32,dur:.45,vol:.13,type:'sine'}]); break;
        case 'win':    this.seq([{f:523,dur:.12,vol:.12},{f:659,at:.1,dur:.12,vol:.12},{f:784,at:.2,dur:.12,vol:.12},{f:1047,at:.3,dur:.18,vol:.13},{f:1319,at:.44,dur:.38,vol:.12}]); break;
        case 'q':      this.seq([{f:988,dur:.09,vol:.08},{f:1175,at:.06,dur:.13,vol:.07}]); break;
        case 'right':  this.seq([{f:659,dur:.09,vol:.11},{f:880,at:.07,dur:.09,vol:.11},{f:1047,at:.14,dur:.2,vol:.12}]); break;
        case 'wrong':  this.seq([{f:330,dur:.14,vol:.13},{f:208,at:.12,dur:.32,vol:.12,type:'sine',glide:130}]); break;
        case 'pump':    this.seq([{f:520,dur:.08,vol:.07}]); break;
        case 'pumpGood':this.seq([{f:660,dur:.07,vol:.09},{f:990,at:.05,dur:.12,vol:.09}]); break;
        case 'throw':   this.seq([{f:400,dur:.3,vol:.12,type:'sine',glide:1100}]); break;
        case 'land':    this.seq([{f:190,dur:.18,vol:.16,type:'sine'}]); break;
        case 'score':   this.seq([{f:659,dur:.1,vol:.11},{f:880,at:.08,dur:.1,vol:.11},{f:1175,at:.16,dur:.22,vol:.12}]); break;
        case 'balloon': this.seq([{f:1200,dur:.06,vol:.12},{f:800,at:.04,dur:.1,vol:.08}]); break;
        case 'drop':    this.seq([{f:500,dur:.4,vol:.12,type:'sine',glide:120},{f:150,at:.3,dur:.25,vol:.16,type:'sine'}]); break;
        case 'rescue':  this.seq([{f:523,dur:.1,vol:.11},{f:784,at:.08,dur:.1,vol:.11},{f:1047,at:.16,dur:.25,vol:.12}]); break;
      }
    }catch(e){}
  },
  toggle(){
    this.on = !this.on;
    try{
      if(this.on) this.ensure();
      if(this.master) this.master.gain.setTargetAtTime(this.on ? .9 : 0, this.ac.currentTime, .04);
    }catch(e){}
    syncSndBtns();
  }
};
function syncSndBtns(){
  for(const b of document.querySelectorAll('.sndBtn')){
    b.classList.toggle('off', !Snd.on);
    b.setAttribute('aria-pressed', String(Snd.on));
  }
}
const sfx = n => Snd.sfx(n);
addEventListener('pointerdown', ()=>Snd.ensure(), true);   /* 任意首次手势解锁声音 */
addEventListener('keydown',    ()=>Snd.ensure(), true);

const SPREAD_W = 1480, SPREAD_H = 900;

/* ---------- 视图缩放：手机「放大 / 还原」+ 拖动平移 ----------
   书页是 1480×900 横版，竖屏手机按宽缩放只剩 ~0.24，字看不清；
   提供用户可控的缩放（1×~2.5×，记住偏好），放大后可拖动平移查看。 */
const VIEW_DEMO = /(selftest|shot|game|ss|sw|bank|honey)/.test(location.hash);
const view = { zoom:1, panX:0, panY:0 };
let baseFit = .65, curFit = .65;
if(!VIEW_DEMO){
  try{
    const z = parseFloat(localStorage.getItem('bookViewZoom'));
    if(z >= 1 && z <= 3) view.zoom = z;
  }catch(e){}
}
function clampPan(){
  const mx = Math.max(0, SPREAD_W*curFit/2 - innerWidth/2  + 18);
  const my = Math.max(0, SPREAD_H*curFit/2 - innerHeight/2 + 18);
  view.panX = Math.max(-mx, Math.min(mx, view.panX));
  view.panY = Math.max(-my, Math.min(my, view.panY));
}
function applyPan(){
  stage.style.setProperty('--panX', view.panX.toFixed(1) + 'px');
  stage.style.setProperty('--panY', view.panY.toFixed(1) + 'px');
}
function saveZoom(){
  if(!VIEW_DEMO){ try{ localStorage.setItem('bookViewZoom', String(view.zoom)); }catch(e){} }
}
function applyView(){
  clampPan(); applyPan(); fitStage();
  const pct = $('vPct');
  if(pct) pct.textContent = Math.round(view.zoom*100) + '%';
  saveZoom();
}

/* ---------- 旋转木马三层布局：桌面 / 竖屏 / 横屏 三套独立参数 ----------
   竖屏不再复用横屏缩放贴图：单独设计一套「三层靠拢」的紧凑布局 —— 点心更大、
   层间距更小，甜甜圈/蛋糕/面包三层同时出现时彼此贴近但绝不重叠；
   横屏保持宽松间距避免拥挤；桌面沿用原 11%/13%。纯函数便于自检直接验证两套比例。 */
const GLAY = { obs:80, step:104, midY:0, lift:24, tagOff:72, mode:'desktop' };
/* 仅用于无头截图/演示：headless 默认 pointer:fine，横屏视口不会被判为触屏。
   hash 带 forceland 时强制走「横屏触屏」分支，带 forceport 时强制走竖屏分支。
   真实手机靠 pointer:coarse + 宽高比自动判定，不受此开关影响。 */
const FORCE_LAND = /forceland/.test(location.hash);
const FORCE_PORT = /forceport/.test(location.hash);
function gameLayoutParams(vw, vh, coarse, portraitOverride){
  const portrait = portraitOverride === undefined ? vh > vw * 1.12 : portraitOverride;
  if(!coarse){                                   // 桌面
    return { mode:'desktop', obs:vw*.11, step:vh*.13, midY:vh*.53, lift:vh*.03, tagOff:vh*.09 };
  }
  if(portrait){                                  // 竖屏专属：点心按宽度做大、三层紧贴靠拢
    const obs = Math.max(52, Math.min(84, vw*.155));
    const step = obs*1.06;                       // 层间距紧贴点心：三层明显靠近，仍不重叠
    return { mode:'portrait', obs, step, midY:vh*.44, lift:step*.16, tagOff:obs*.6 };
  }
  const obs = Math.max(44, Math.min(100, vh*.17)); // 横屏：受高度限制，点心小些、间距宽松
  const step = obs*1.3;                          // 拉开层距，避免图标拥挤混乱
  return { mode:'landscape', obs, step, midY:vh*.5, lift:step*.22, tagOff:obs*.7 };
}
function layoutGame(){
  const vw = innerWidth, vh = innerHeight;
  const coarse = FORCE_LAND || FORCE_PORT || matchMedia('(pointer:coarse)').matches || vw < 700;
  const P = gameLayoutParams(vw, vh, coarse, FORCE_LAND ? false : (FORCE_PORT ? true : undefined));
  GLAY.mode = P.mode; GLAY.obs = P.obs; GLAY.step = P.step; GLAY.midY = P.midY;
  GLAY.lift = P.lift; GLAY.tagOff = P.tagOff;
  const gel = $('game');
  gel.style.setProperty('--obsPx', P.obs.toFixed(1) + 'px');
  gel.style.setProperty('--bandH', (P.step * 1.12).toFixed(1) + 'px');
  $('gLaneBand').style.top = P.midY.toFixed(1) + 'px';   // 光带基准一次性写，运行期只动 transform
  /* 方向/尺寸变化后同步已存在障碍的 top 基准（try 兜住初始化期的暂时性未定义） */
  try{
    for(const o of game.obs){
      for(const p of o.pieces) p.el.style.top = laneY(p.lane).toFixed(1) + 'px';
      if(o.tag) o.tag.style.top = (laneY(Math.max(...o.lanes)) - P.tagOff).toFixed(1) + 'px';
    }
  }catch(e){}
}
function laneY(lane){ return GLAY.midY + (1 - lane) * GLAY.step; }   /* 2上 · 1中 · 0下 */

/* ---------- 自适应 ---------- */
function fitStage(){
  const vw = innerWidth, vh = innerHeight;
  const padX = vw < 760 ? 14 : 44, padY = vw < 760 ? 14 : 44;

  curFit  = baseFit * view.zoom;
  stage.style.setProperty('--fit', curFit.toFixed(4));
  layoutGame();

  const smallPortrait = vh > vw*1.1 && vw < 900 && baseFit < .5;
  const rt = $('rotateTip');
  rt.style.opacity = smallPortrait ? .8 : 0;
  rt.classList.toggle('hot', smallPortrait);   /* 可见时可点击 → 一键放大 */
}

const layers = [...document.querySelectorAll('.plx')].map(el=>({

/* ---------- 旋转木马 ---------- */
const N = 8, SPAN = Math.PI*2/N;
const ORB = { ax:31, h:23.5, base:11.8, rise:2.2, sMin:.78, sMax:1, top:54 };
const spin = { on:false, speed:0, ang:0, items:[] };

(function buildHorses(){
  for(let i=0;i<N;i++){
    const mk = host => {
      const g = document.createElement('div');
      g.className = 'horse';
      const pole = document.createElement('div');
      pole.className = 'pole';
      const cap = document.createElement('div');
      cap.className = 'cap';
      const img = document.createElement('img');
      img.src = 'assets/horse.webp'; img.alt = '';
      g.append(pole, cap, img);
      host.appendChild(g);
      return { g, pole, cap, img };
    };
    const b = mk(hBack), f = mk(hFront);
    spin.items.push({ b, f });
  }
})();

rideBtn.addEventListener('click', ()=>{
  spin.on = !spin.on;
  rideBtn.classList.toggle('on', spin.on);
  rideBtn.setAttribute('aria-pressed', String(spin.on));
  rideLbl.textContent = spin.on ? '让木马停下来' : '让木马转起来';
  sfx(spin.on ? 'spin' : 'tap');
});

function updateCarousel(dt, t){
  const H = carousel.clientHeight, W = carousel.clientWidth;
  spin.speed += ((spin.on ? .72 : 0) - spin.speed) * Math.min(1, dt*2.0);
  spin.ang += spin.speed * dt;

  const jitter = spin.speed * 1.2;
  carBody.style.transform = jitter > .004
    ? `translateY(${(Math.sin(t*9.5)*jitter*.3).toFixed(2)}px)` : '';

  for(let i=0;i<N;i++){
    const it = spin.items[i];
    const th = spin.ang + i*SPAN;
    const d  = Math.cos(th);                       // 1 = 最近
    const dep = (d+1)/2;                           // 0 最远 → 1 最近
    const s  = ORB.sMin + (ORB.sMax-ORB.sMin)*dep;
    const x  = Math.sin(th) * ORB.ax;              // 水平偏离中心 %
    const bob = Math.sin(th*2 + i*1.7 + t*3.4) * 1.5 * (.30 + .70*spin.speed/.72);
    const bot = ORB.base + (1-dep)*ORB.rise + bob*Math.max(0,.2);
    const front = d >= 0;

    const on  = front ? it.f : it.b;
    const off = front ? it.b : it.f;
    off.g.style.opacity = 0;

    on.g.style.opacity = 1;
    on.g.style.left   = (50 + x) + '%';
    on.g.style.bottom = bot.toFixed(2) + '%';
    on.g.style.height = (ORB.h*s).toFixed(2) + '%';

    // 立柱：从柱帽一直伸到檐口
    const len = Math.max(0, (ORB.top - bot)/100*H);
    const pw  = Math.max(2, ORB.h*s/100*H*24/456);
    on.pole.style.height = len.toFixed(1) + 'px';
    on.pole.style.width  = pw.toFixed(1) + 'px';
    on.pole.style.opacity = front ? 1 : .92;
    on.cap.style.width  = (pw*2.3).toFixed(1) + 'px';
    on.cap.style.height = (pw*3.0).toFixed(1) + 'px';

    on.img.style.transform = `translateX(-50%) scaleX(${i%2 ? -1 : 1})`;
    on.img.style.filter = front
      ? (d > .97 ? 'none' : `brightness(${(1-(1-d)*.12).toFixed(3)})`)
      : `brightness(${(.90+(1+d)*.055).toFixed(3)}) saturate(.97)`;
  }
}

/* ---------- 跷跷板 ---------- */
const MAXA = 8.6*Math.PI/180;
const tee = { a:0, v:0, lagL:0, lagR:0 };
function hitSeesaw(dir){ tee.v += dir*0.52; sfx('seesaw'); }
$('seesawHitL').addEventListener('pointerdown', e=>{e.preventDefault(); hitSeesaw(-1);});
$('seesawHitR').addEventListener('pointerdown', e=>{e.preventDefault(); hitSeesaw( 1);});

function updateSeesaw(dt){
  const k = 13.0, c = 2.0;
  tee.v += (-k*tee.a - c*tee.v)*dt;
  tee.a += tee.v*dt;
  if(tee.a >  MAXA){ tee.a =  MAXA; tee.v *= -0.32; }
  if(tee.a < -MAXA){ tee.a = -MAXA; tee.v *= -0.32; }

  sBoard.style.transform = `rotate(${(tee.a*180/Math.PI).toFixed(3)}deg)`;

  const f = Math.min(1, dt*10);
  tee.lagL += (tee.a - tee.lagL)*f;
  tee.lagR += (tee.a - tee.lagR)*f;
  const wL = Math.max(-6, Math.min(6, (tee.lagL - tee.a)*115));
  const wR = Math.max(-6, Math.min(6, (tee.lagR - tee.a)*115));
  sBearL.style.transform = `rotate(${wL.toFixed(2)}deg)`;
  sBearR.style.transform = `rotate(${wR.toFixed(2)}deg)`;
}

/* ---------- 秋千 ---------- */
const SW_MAX = 17*Math.PI/180;
const SW_L = 0.677;
const seats = [
  { el:$('seatA'), pv:[563/1400, 112/1134], a:0, v:0, drag:false, hist:[] },
  { el:$('seatB'), pv:[863/1400, 112/1134], a:0, v:0, drag:false, hist:[] }
];
function angleAt(s, ev){
  const r = s.el.parentElement.getBoundingClientRect();
  const px = r.left + r.width * s.pv[0];
  const py = r.top  + r.height* s.pv[1];
  const dx = ev.clientX - px;
  const dy = Math.max(10, ev.clientY - py);
  return Math.atan2(dx, dy);
}
for(const s of seats){
  s.el.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    try{ s.el.setPointerCapture(ev.pointerId); }catch(err){}
    s.drag = true; s.v = 0; s.hist = [];
    s.a = Math.max(-SW_MAX, Math.min(SW_MAX, angleAt(s, ev)));
  });
  s.el.addEventListener('pointermove', ev=>{
    if(!s.drag) return;
    s.a = Math.max(-SW_MAX, Math.min(SW_MAX, angleAt(s, ev)));
    const now = performance.now();
    s.hist.push({a:s.a, t:now});
    while(s.hist.length > 1 && now - s.hist[0].t > 120) s.hist.shift();
  });
  const end = ()=>{
    if(!s.drag) return;
    s.drag = false;
    if(s.hist.length >= 2){
      const f = s.hist[0], l = s.hist[s.hist.length-1];
      const dtm = (l.t - f.t)/1000;
    if(dtm > .012) s.v = Math.max(-4.5, Math.min(4.5, (l.a - f.a)/dtm));
    if(Math.abs(s.v) > .8) sfx('swing');
  }
    s.hist = [];
  };
  s.el.addEventListener('pointerup', end);
  s.el.addEventListener('pointercancel', end);
}
function updateSwing(dt){
  const G = 6.2, DAMP = 0.36;
  for(const s of seats){
    if(s.drag) continue;
    s.v += (-(G/SW_L)*Math.sin(s.a) - DAMP*s.v)*dt;
    s.a += s.v*dt;
    if(Math.abs(s.a) > SW_MAX){ s.a = Math.sign(s.a)*SW_MAX; s.v *= -0.26; }
    if(Math.abs(s.a) < .0012 && Math.abs(s.v) < .003){ s.a = 0; s.v = 0; }
    s.el.style.transform = `rotate(${(s.a*180/Math.PI).toFixed(3)}deg)`;
  }
}

const INSTANT = /shot|selftest/.test(location.hash);
const DIALOG = {

  carousel:{ tag:'旋转木马', anchor:'carousel', dy:-35,

  seesaw:  { tag:'跷跷板',   anchor:'seesaw',   dy:12,

             pick:'seesaw', play:'seesaw' },

function clearPicks(){

function resetBubble(){
  bNext.classList.remove('on'); bPlay.classList.remove('show');

}

function placeBubble(d){
  const sr = stage.getBoundingClientRect();
  const sc = sr.width / SPREAD_W;
  const ar = $(d.anchor).getBoundingClientRect();
  const cx  = (ar.left + ar.width/2 - sr.left)/sc + (d.dx || 0);
  const top = (ar.top - sr.top)/sc;
  bubble.style.width = '';
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  const half = bw/2;
  const left = Math.max(half + 14, Math.min(SPREAD_W - half - 14, cx));
  let bottom = (SPREAD_H - top) + (d.dy === undefined ? 14 : d.dy);
  bottom = Math.max(12, Math.min(SPREAD_H - bh - 12, bottom));
  bubble.style.left = left.toFixed(1) + 'px';
  bubble.style.bottom = bottom.toFixed(1) + 'px';
  bubble.style.width = bw + 'px';   // 固定宽度：逐字打出时不抖动
}
function render(){
  const d = DIALOG[cur.key];
  const honey = bankFull() && (cur.key==='bearA' || cur.key==='bearB');  // 集满 15 星 → 蜂蜜奖励对话
  const txt = honey ? HONEY_LINE : d.lines[cur.i];
  const last = honey ? true : cur.i === d.lines.length - 1;
  const canPlay = !honey && !!d.play && last;
  const canNext = honey ? false : !last;

  resetBubble();
  bubble.classList.toggle('hasGift', honey);
  bTag.textContent = honey ? '小熊 · 惊喜' : d.tag;
  bTxt.textContent = txt;           // 先写全文用于测量气泡尺寸
  placeBubble(d);
  bubble.classList.add('show');

  if(INSTANT){

/* ---------- 主循环 ---------- */
let last = performance.now(), frameN = 0, lastDt = 0, clock = 0;
function step(dt, t){
  if(game.active){ if(!game.paused) updateGame(dt); return; }
  if(ss.active){ if(!ss.paused) updateSS(dt); return; }
  if(sw.active){ if(!sw.paused) updateSW(dt); return; }
  paintParallax(dt);
  updateCarousel(dt, t);
  updateSeesaw(dt);
  updateSwing(dt);

  balloons.style.transform =
    `translateX(-50%) translate(${(Math.sin(t*.85)*4).toFixed(2)}px,${(Math.cos(t*1.2)*6).toFixed(2)}px) rotate(${(Math.sin(t*.62)*1.5).toFixed(2)}deg)`;
}
function loop(now){
  const dt = Math.max(0, Math.min(.05, (now-last)/1000));
  last = now; frameN++; lastDt = dt; clock += dt;
  step(dt, clock);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const BANK_KEY   = 'popupbook_stars_v1';
const BANK_DEMO  = /(selftest|shot|game|ss|sw|bank)/.test(location.hash); // 演示/自检态只用内存、不写盘
const BANK_NAMES = { carousel:'旋转木马', seesaw:'跷跷板', swing:'秋千' };
const bank = { carousel:0, seesaw:0, swing:0 };
try{
  if(!BANK_DEMO){
    const raw = localStorage.getItem(BANK_KEY);
    if(raw){ const o = JSON.parse(raw);
      for(const k in bank) if(Number.isFinite(o[k])) bank[k] = Math.max(0, Math.min(5, o[k]|0)); }
  }
}catch(e){}
function bankTotal(){ return bank.carousel + bank.seesaw + bank.swing; }
function bankFull(){ return bankTotal() >= 15; }
function bankSet(game, n){
  n = Math.max(0, Math.min(5, Math.round(n)));
  if(n <= bank[game]) return false;             // 每个游戏只取历史最高，低分不回退
  const wasFull = bankFull();
  bank[game] = n;
  if(!BANK_DEMO){ try{ localStorage.setItem(BANK_KEY, JSON.stringify(bank)); }catch(e){} }
  renderBank();
  if(!wasFull && bankFull()) sfx('win');        // 首次集满 15 颗的庆祝音
  return true;
}
function bankReset(){ for(const k in bank) bank[k] = 0; renderBank(); }   // 仅自检用

  return `<svg viewBox="0 0 100 100"><path d="M50 6 L62 38 L96 40 L69 60 L79 94 L50 74 L21 94 L31 60 L4 40 L38 38 Z" fill="${lit?'#f5b942':'#e6d9c0'}" stroke="#fffaf0" stroke-width="6" stroke-linejoin="round"/></svg>`;
}

  $('sbTip').textContent   = full ? '去找小熊领蜂蜜吧！' : '点一下看每个游戏 ↗';

}

/* 每一层固定摆一种独立小点心：上层=蛋糕、中层=甜甜圈、下层=面包。
   障碍占哪几层，就在那几格各摆一个对应的小剪纸——不再把两层叠成一整块

/* 逼近评估：实时告诉玩家「安不安全 / 该按哪个键」，并驱动边缘预警 */
function assess(){
  const near = game.obs.filter(o => o.z > .34 && o.z < 1.02);
  const mine = near.filter(o => o.col === game.col);
  let allowed = [0,1,2];
  for(const o of mine) allowed = allowed.filter(l => SAFE[o.type].includes(l));
  const lead = mine.slice().sort((a,b)=>b.z-a.z)[0];

  let mode = 'idle', ico = '', txt = '', dir = 'none', intensity = 0;
  if(lead){
    intensity = Math.max(0, Math.min(1, (lead.z - .34)/.66));
    if(allowed.includes(game.lane)){
      mode = 'safe'; ico = '✓'; txt = '稳住！保持这一层';
    } else if(allowed.length){
      const target = allowed.reduce((a,b)=>Math.abs(b-game.lane)<Math.abs(a-game.lane)?b:a);
      const up = target > game.lane;
      mode = 'danger'; dir = up ? 'up' : 'down';
      ico = up ? '↑' : '↓'; txt = (up ? '升到' : '降到') + LANENAME[target] + '层！';
    } else {                                   /* 当前列无解，找一条空跑道 */
      const busy = new Set(near.map(o=>o.col));
      const free = [1,0,2].find(c => !busy.has(c) && c !== game.col);
      if(free !== undefined){
        dir = free < game.col ? 'left' : 'right';
        ico = dir === 'left' ? '←' : '→'; txt = '换条跑道！'; mode = 'danger';
      }
    }
    if(!allowed.includes(game.lane)) for(const o of mine) o.wasDanger = true;
  }

  G.warn.style.opacity = (mode === 'danger' ? (.2 + intensity*.7) : 0).toFixed(2);
  G.warn.classList.toggle('pulse', mode === 'danger' && intensity > .42);
  if(mode === 'idle') G.cue.className = '';
  else { G.cue.className = 'on ' + mode; G.cueIco.textContent = ico; G.cueTxt.textContent = txt; }
  G.padBtns.forEach(b => b.classList.toggle('cue', b.dataset.dir === dir));
  const dm = mode === 'danger';
  if(dm && !game.wasWarn){ sfx('warn'); game.wasWarn = true; }   /* 进入危险只响一次，不每帧睛 */
  if(!dm) game.wasWarn = false;
}

/* 成功躲过一个障碍：计数 + 飘字 + 涟漪 + 轻晃 + 触感 */
function showDodge(clutch){
  sfx('dodge');
  game.dodged++;
  G.dodgedEl.innerHTML = '已躲开 <b>' + game.dodged + '</b>';
  const s = document.createElement('span');
  s.textContent = clutch ? '好险！+1' : ['漂亮！+1','稳稳的 +1','躲开啦 +1'][Math.floor(Math.random()*3)];
  if(clutch) s.className = 'clutch';
  s.style.left = (50 + (Math.random()*18-9)).toFixed(0) + '%';
  G.pop.appendChild(s);
  while(G.pop.children.length > 3) G.pop.firstChild.remove();
  setTimeout(()=>s.remove(), 950);
  G.ring.classList.remove('go'); void G.ring.offsetWidth; G.ring.classList.add('go');
  game.bump = 1;
  try{ if(navigator.vibrate) navigator.vibrate(clutch ? [16,18,16] : 12); }catch(e){}
}
function posObs(o){
  const z = Math.max(0, o.z);
  const e = Math.min(1, z);                       // 逼近进度，仅用于轻微缩放/淡入
  const s = .62 + e*.4;                           // 0.62→1.02，绝不放大成一整块
  let op = 1;
  if(z < .06) op = z/.06;                         // 远处淡入
  else if(z > 1.02) op = Math.max(0, (1.16-z)/.14);  // 掠过淡出
  /* 运行期只改 transform / opacity / zIndex —— 全是合成层属性，不碰 left/top（零强制重排）。
     left/top 已在 makeObs 生成时按「列/层」固定，逼近时的轻微上浮并入 translateY。 */
  const liftPx = (-(1-e)*GLAY.lift).toFixed(1);
  const tf = `translate(-50%,-50%) translateY(${liftPx}px) scale(${s.toFixed(3)})`;
  const zi = 5 + Math.round(z*100);
  for(const p of o.pieces){
    p.el.style.transform = tf;
    p.el.style.zIndex = zi;
    p.el.style.opacity = op.toFixed(2);
  }
  if(o.tag){                    /* 坐标牌：位置固定，运行期只改淡入淡出 */
    o.tag.style.opacity = (z > .12 && z < 1.04)
      ? Math.min(1, (z-.12)/.1).toFixed(2) : '0';
  }
}
function makeObs(col, type){
  const lanes = BLOCK[type].slice().sort((a,b)=>a-b);   // 被挡的层（升序：下→上）
  const cx = COLX[col].toFixed(2)+'%';
  /* 一片 = 一格：按该层固定的点心摆一个独立小剪纸；中间层自然就是甜甜圈，
     上层蛋糕、下层面包各自只占自己那一格，绝不叠成一整块蛋糕山/面包塔。
     left/top 在生成时按「列/层」一次写定（列与层终身不变），运行期不再改。 */
  const pieces = lanes.map((lane)=>{
    const pt = LANE_TYPE[lane];
    const el = document.createElement('div');
    el.className = 'gObs ' + pt + (lanes.length > 1 ? ' stack' : '');
    el.innerHTML = `<div class="art">${ART[pt]}</div>`;   // 纯剪纸，无分层背景
    el.style.left = cx;
    el.style.top  = laneY(lane).toFixed(1)+'px';
    G.world.appendChild(el);
    return { el, lane, pt };
  });
  const tag = document.createElement('div');
  tag.className = 'gObsTag';
  tag.innerHTML = `<b>${COLNAME[col]}列 · ${layerDesc(lanes)}</b>` +
    `<span>${pieceDesc(lanes)} · 挡${lanes.length}层</span>`;
  tag.style.left = cx;
  tag.style.top  = (laneY(Math.max(...lanes)) - GLAY.tagOff).toFixed(1)+'px';
  tag.style.zIndex = '120';
  G.world.appendChild(tag);
  return { col, type, lanes, z:0, pieces, tag, passed:false, wasDanger:false };
}
function spawnWave(){
  const p = Math.min(1, game.t/game.dur);
  const n = Math.random() < (.64 - .10*p) ? 1 : 2;   // 每波随机占 1~2 列
  const cols = [0,1,2].sort(()=>Math.random()-.5).slice(0,n);
  for(const c of cols) game.obs.push(makeObs(c, GTYPE[Math.floor(Math.random()*3)]));
}
function stepRun(h){
  game.t += h;
  setStars(Math.min(5, Math.floor(game.t/60)));
  if(game.t >= game.dur){ game.t = game.dur; win(); return; }
  const p = Math.min(1, game.t/game.dur);
  const speed = .30 + .24*p;
  game.next -= h;
  if(game.next <= 0){
    spawnWave();
    game.next = (2.7 - 1.5*p)*(.85 + Math.random()*.3);
  }
  for(let i=game.obs.length-1;i>=0;i--){
    const o = game.obs[i];
    const pz = o.z;
    o.z += speed*h;
    if(o.z > 1.15){ dropObs(o); game.obs.splice(i,1); continue; }
    if(!game.god && o.z > .92 && o.z < 1.02 && o.col === game.col && !SAFE[o.type].includes(game.lane)){
      fail(); return;
    }
    if(!o.passed && pz < 1.02 && o.z >= 1.02){   /* 安全掠过：一次成功躲避 */
      o.passed = true;
      showDodge(!!o.wasDanger);
    }
  }
}
function updateGame(dt){
  game.swing += dt;
  const bob  = Math.sin(game.swing*Math.PI*1.10);
  const sway = Math.sin(game.swing*Math.PI*0.56);
  game.bump = Math.max(0, game.bump - dt*3.2);
  const shake = game.bump*Math.sin(game.bump*27)*3.4;
  G.ride.style.transform =
    `translateY(${(bob*7 + shake).toFixed(2)}px) rotate(${(sway*.9 + shake*.24).toFixed(2)}deg)`;
  /* 位置平滑趋近目标：位移大、带倾斜，让换列/升降一眼可见 */
  const k = Math.min(1, dt*9);
  game.cx += (game.col - game.cx)*k;
  game.ly += (game.lane - game.ly)*k;
  /* 镜头跟随：整个场景反向平移，让「我所在列」永远落在画面正中；马头固定居中 */
  G.cam.style.transform = `translateX(${((1-game.cx)*COLW).toFixed(2)}%)`;
  const lift = game.ly - 1;                       /* 上层 >0：马头上移、投影变小淡 */
  const tilt = (game.col - game.cx)*6;            /* 换列时轻微侧倾，位移感交给镜头 */
  const vy = GLAY.step * .65;                     /* 随层间距缩放，横竖屏幅度一致 */
  G.horse.style.transform =
    `translateX(-50%) translateY(${(-bob*10 - lift*vy).toFixed(1)}px) ` +
    `rotate(${(tilt + sway*1.6).toFixed(2)}deg) scale(${(1 - lift*.05).toFixed(3)})`;
  G.shadow.style.opacity = (.5 - lift*.16).toFixed(2);
  G.shadow.style.transform = `translateX(-50%) scale(${(1 - lift*.3).toFixed(3)})`;
  /* 当前层的「选中」奶白光带：随升降平滑上下，只改 transform（不触发重排） */
  G.band.style.transform = `translate(-50%,-50%) translateY(${((1-game.ly)*GLAY.step).toFixed(1)}px)`;
  if(game.state !== 'playing') return;

  let remain = dt*(game.fast ? 20 : 1), guard = 0;
  while(remain > 0 && game.state === 'playing' && guard++ < 400){
    const h = Math.min(remain, 1/60);
    stepRun(h); remain -= h;
  }
  for(const o of game.obs) posObs(o);
  if(game.state === 'playing') assess(); else clearDangerUi();
  updateGrid(); updateHud();
}
function gMove(dc, dl){
  if(game.state !== 'playing' || game.paused) return;
  const oc = game.col, ol = game.lane;
  game.col  = Math.max(0, Math.min(2, game.col + dc));
  game.lane = Math.max(0, Math.min(2, game.lane + dl));
  if(game.col === oc && game.lane === ol) return;
  sfx('move');
  setPosUi(); updateGrid();
  G.hint.textContent = game.col !== oc ? (game.col < oc ? '←' : '→')
                                       : (game.lane > ol ? '↑' : '↓');
  G.hint.classList.remove('pop'); void G.hint.offsetWidth; G.hint.classList.add('pop');
  assess();                              /* 按键后立刻刷新安危提示，跟手 */
}

function openGame(){

/* ---------- 暂停：HUD 按钮 + ESC，游戏逻辑与画面一起冻结 ---------- */
function syncPauseBtn(){

function pauseGame(){
