/* 输入：键盘 + 触屏 */
addEventListener('keydown', e=>{
  if(!game.active) return;
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  if(k === 'escape'){
    if(game.state === 'playing'){ game.paused ? resumeGame() : pauseGame(); }
    else closeGame();
    return;
  }
  if(k === 'arrowleft'  || k === 'a') gMove(-1,0);
  else if(k === 'arrowright' || k === 'd') gMove( 1,0);
  else if(k === 'arrowup'    || k === 'w') gMove(0, 1);
  else if(k === 'arrowdown'  || k === 's') gMove(0,-1);
}, {passive:false});

let gTouch = null;
G.el.addEventListener('pointerdown', e=>{
  if(e.target.closest('button')) return;
  gTouch = [e.clientX, e.clientY];
});
G.el.addEventListener('pointerup', e=>{
  if(!gTouch) return;
  const dx = e.clientX - gTouch[0], dy = e.clientY - gTouch[1];
  gTouch = null;
  if(Math.hypot(dx,dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)) gMove(dx>0?1:-1, 0);
  else gMove(0, dy<0?1:-1);
});
G.el.querySelectorAll('#gTouch button').forEach(b=>b.addEventListener('click', ()=>{
  const d = b.dataset.dir;
  if(d === 'left') gMove(-1,0);
  else if(d === 'right') gMove(1,0);
  else if(d === 'up') gMove(0,1);
  else gMove(0,-1);
}));
$('gExit').addEventListener('click', closeGame);
$('gPause').addEventListener('click', ()=> game.paused ? resumeGame() : pauseGame());
syncPauseBtn();

/* ============ 跷跷板 · 快速配平游戏 ============ */
const SS_MAX_DEG = 26;                 // 坠地（5/5）时的最大右倾角
const SS_QTIME   = 3;                  // 每题 3 秒
const SS_WMAX    = 5;                  // 累计答错 5 次坠地
const SS_GOAL    = 25;                 // 答对 25 题集满 5 星
const SS_OPS = {'+':'+','-':'−','*':'×','/':'÷'};
const SS = {
  el:$('ss'), board:$('ssBoard'), bearL:$('ssBearL'), bearR:$('ssBearR'),
  shadow:$('ssShadow'), qCard:$('ssQ'), expr:$('ssExpr'), bar:$('ssBar'),
  ans:$('ssAns'), stars:$('ssStars'), okEl:$('ssOk'), lives:$('ssLives'),
  pop:$('ssPop'), panel:$('ssPanel'), card:$('ssCard')
};
const ss = {
  active:false, state:'ready', paused:false, gen:0,
  wrong:0, ok:0, stars:0, q:null, tLeft:SS_QTIME, angle:0,
  tilt:0        // 视觉倾斜格数：答错 +1、答对归 0（与累计次数 wrong 彻底分离）
};

/* 出题：一位数 +-×÷（除法整除、结果非负）或两位数 +-；候选 4 选 1 */
function ssGenQ(){
  const R = n => 1 + Math.floor(Math.random()*n);
  let a, b, op, ans;
  const kind = Math.random();
  if(kind < .42){                          // 一位数
    if(kind < .14){      op='+'; a=R(9); b=R(9); ans=a+b; }
    else if(kind < .26){ op='-'; a=R(9); b=R(9); if(b>a){const t=a;a=b;b=t;} ans=a-b; }
    else if(kind < .36){ op='*'; a=R(9); b=R(9); ans=a*b; }
    else {               op='/'; b=R(9); ans=R(9); a=b*ans; }
  } else {                                 // 两位数加减
    op = Math.random() < .5 ? '+' : '-';
    a = 10 + Math.floor(Math.random()*80);
    b = 10 + Math.floor(Math.random()*80);
    if(op==='-' && b>a){ const t=a;a=b;b=t; }
    ans = op==='+' ? a+b : a-b;
  }
  const set = new Set([ans]);
  let guard = 0;
  while(set.size < 4 && guard++ < 80){     // 邻近干扰项：±1~±9，非负、互异
    const d = (Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*(ans<=6?4:9)));
    const v = ans + d;
    if(v >= 0 && !set.has(v)) set.add(v);
  }
  guard = 0;
  while(set.size < 4 && guard++ < 80){     // 小答案附近凑不满时的兜底
    const v = Math.floor(Math.random()*(ans+12));
    if(!set.has(v)) set.add(v);
  }
  return { a, b, op, ans, cands:[...set].sort(()=>Math.random()-.5) };
}

function ssUpdateHud(){ SS.okEl.innerHTML = `答对 <b>${ss.ok}</b> / ${SS_GOAL}`; }
function ssSetLives(){
  SS.lives.innerHTML = '<b>平衡</b>';
  for(let i=0;i<SS_WMAX;i++){
    const s = document.createElement('i');
    if(i >= SS_WMAX - ss.wrong) s.className = 'off';
    SS.lives.appendChild(s);
  }
}
function ssPop(txt, bad){
  const s = document.createElement('span');
  s.textContent = txt;
  if(bad) s.className = 'bad';
  s.style.left = (Math.random()*10-5).toFixed(0) + '%';
  SS.pop.appendChild(s);
  while(SS.pop.children.length > 3) SS.pop.firstChild.remove();
  setTimeout(()=>s.remove(), 980);
}
function ssSetStars(n){
  if(n <= ss.stars) return;
  const svgs = SS.stars.children;
  for(let i=ss.stars;i<n;i++) svgs[i].outerHTML = starSvg(true);
  ss.stars = n;
  sfx('star');
  bankSet('seesaw', n);               // 上报集星账本（取最高）
}

/* 倾斜渲染：目标 = 视觉倾斜(tilt，答对归零→水平) + 答题中的临时微倾；
   累计答错次数 wrong 只管平衡格与 5 次坠地判定，不再决定板子角度 */
function ssRender(dt){
  let target = ss.tilt / SS_WMAX;
  if(ss.state === 'playing' && !ss.paused && ss.q)
    target += .08 * (1 - Math.max(0, ss.tLeft)/SS_QTIME);   // 仅答题中越接近超时越歪；换题间隙停基准
  if(ss.state === 'over') target = 1;                        // 坠地到底
  target = Math.min(1, target);
  const k = Math.min(1, dt*7);
  ss.angle += (target*SS_MAX_DEG - ss.angle)*k;
  SS.board.style.transform = `rotate(${ss.angle.toFixed(3)}deg)`;
  const w = Math.max(-8, Math.min(8, -ss.angle*.34));        // 小熊反相轻摆，努力坐稳
  SS.bearL.style.transform = `rotate(${w.toFixed(2)}deg)`;
  SS.bearR.style.transform = `rotate(${(w*1.15).toFixed(2)}deg)`;
  SS.shadow.style.transform = `translateX(${(-50 + ss.angle*.4).toFixed(2)}%)`;
}
function updateSS(dt){
  ssRender(dt);
  // 换题/结算间隙(ss.q=null) 必须冻结倒计时：否则 tLeft 越过 0 后每帧都会重复触发
  // ssDrop，一次超时被连扣到 5 格直接坠地——这正是「只错一道就输」的根因。
  if(ss.state !== 'playing' || ss.paused || !ss.q) return;
  ss.tLeft -= dt;
  SS.bar.style.width = (Math.max(0, ss.tLeft)/SS_QTIME*100).toFixed(1) + '%';
  SS.qCard.classList.toggle('low', ss.tLeft <= 1);
  if(ss.tLeft <= 0) ssDrop(true);
}

function ssNewQ(){
  ss.gen++;
  ss.q = ssGenQ();
  ss.tLeft = SS_QTIME;
  SS.expr.textContent = `${ss.q.a} ${SS_OPS[ss.q.op]} ${ss.q.b} = ?`;
  SS.ans.innerHTML = '';
  ss.q.cands.forEach((v,i)=>{
    const b = document.createElement('button');
    b.className = 'ssOpt';
    b.textContent = v;
    b.dataset.key = i+1;
    b.addEventListener('click', ()=>ssAnswer(v, b));
    SS.ans.appendChild(b);
  });
  SS.bar.style.width = '100%';
  SS.qCard.classList.remove('low');
  sfx('q');
}
function ssNext(delay){
  ss.q = null;                              // 锁输入，短暂展示后再出下一题
  const g = ss.gen;
  setTimeout(()=>{
    if(ss.active && ss.state==='playing' && !ss.paused && ss.gen===g) ssNewQ();
  }, delay*1000);
}
function ssAnswer(v, btn){
  if(ss.state !== 'playing' || ss.paused || !ss.q) return;
  if(btn) btn.classList.add(v === ss.q.ans ? 'hit' : 'miss');
  if(v === ss.q.ans){
    ss.ok++; ssUpdateHud();
    ss.tilt = 0;                 // 答对把跷跷板压回水平（最初状态），但 wrong 累计不减
    sfx('right');
    if(ss.ok % 5 === 0){ ssSetStars(ss.ok/5); ssPop(`点亮第 ${ss.ok/5} 颗星！`); }
    else ssPop(['答对啦','稳稳压住','配平成功'][Math.floor(Math.random()*3)]);
    if(ss.ok >= SS_GOAL){ ssWin(); return; }
    ssNext(.55);
  } else {
    ssDrop(false);
  }
}
/* 答错 / 超时：累计次数 +1、视觉再坠一格；累计满 5 次坠地 */
function ssDrop(timeout){
  ss.wrong++;
  ss.tilt = Math.min(SS_WMAX, ss.tilt + 1);
  sfx('wrong');
  ssSetLives();
  ssPop(timeout ? '超时啦！坠一格' : '歪了！坠一格', true);
  ss.q = null; SS.ans.innerHTML = '';
  if(ss.wrong >= SS_WMAX){
    ss.state = 'over';
    sfx('fail');
    setTimeout(()=>{ if(ss.active && ss.state==='over') ssShowPanel('over'); }, 750);
    return;
  }
  ssNext(.7);
}
function ssWin(){
  ss.state = 'win';
  ssSetStars(5);
  sfx('win');
  ssShowPanel('win');
}
function ssButtons(label){
  return `<div class="gBtns"><button class="gBtn" data-act="go">${label}</button>
    <button class="gBtn ghost" data-act="back">回到书页</button></div>`;
}
function ssShowPanel(kind){
  ss.state = kind;
  SS.panel.classList.add('on');
  if(kind === 'ready'){
    SS.card.innerHTML = `
      <h2>跷跷板 · 快速配平</h2>
      <p>右端会不断出现 <b>3 秒考题</b>，在左边点出正确答案，帮小熊压稳跷跷板。<br>
      答对把板子压回水平，答错或超时则坠一格、并消耗一格平衡；<b>答对不会补回平衡</b>，累计消耗 5 格就落地啦。<br>
      每答对 5 题点亮 1 颗星，集满 5 颗星获胜。</p>
      <p>点候选数作答 · 键盘 1~4 也能选 · ESC 暂停</p>
      ${ssButtons('出发！')}`;
  } else if(kind === 'over'){
    SS.card.innerHTML = `
      <h2>哎呀，坠地啦！</h2>
      <p>这一轮答对 ${ss.ok} 题，点亮 ${ss.stars} 颗星。<br>就差一点点就压住了～</p>
      ${bigStars(ss.stars)}
      ${ssButtons('再来一次')}`;
  } else {
    SS.card.innerHTML = `
      <h2>五颗星，配平大师！</h2>
      <p>25 道题全部答对，跷跷板稳稳当当 ✦</p>
      ${bigStars(5)}
      <p>要再来一轮吗？</p>
      ${ssButtons('再玩一次')}`;
  }
  SS.card.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.act === 'back') closeSeesaw(); else ssStart();
  }));
}
function ssStart(){
  ss.paused = false; ssSyncPauseBtn();
  SS.panel.classList.remove('on');
  ss.state = 'playing';
  ss.wrong = 0; ss.ok = 0; ss.stars = 0; ss.angle = 0; ss.tilt = 0; ss.q = null;
  SS.stars.innerHTML = Array.from({length:5},()=>starSvg(false)).join('');
  SS.pop.innerHTML = '';
  ssSetLives(); ssUpdateHud();
  Snd.mood = 'play'; sfx('start');
  ssNewQ();
}
function ssPause(){
  if(!ss.active || ss.state !== 'playing' || ss.paused) return;
  ss.paused = true;
  sfx('tap');
  SS.card.innerHTML = `
    <h2>先歇一会儿</h2>
    <p>小熊稳住跷跷板等你回来～<br>按 <b>ESC</b> 或点「继续」接着玩。</p>
    <div class="gPauseStat">已答对 ${ss.ok} 题 · 坠 ${ss.wrong}/5 格 · ${ss.stars} 颗星</div>
    <div class="gBtns">
      <button class="gBtn" data-act="resume">继续游戏</button>
      <button class="gBtn ghost" data-act="restart">重新开始</button>
      <button class="gBtn ghost" data-act="back">回到书页</button>
    </div>`;
  SS.card.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>{
    const a = b.dataset.act;
    if(a === 'resume') ssResume();
    else if(a === 'restart') ssStart();
    else closeSeesaw();
  }));
  SS.panel.classList.add('on');
  ssSyncPauseBtn();
}
function ssResume(){
  if(!ss.paused) return;
  ss.paused = false;
  SS.panel.classList.remove('on');
  sfx('tap');
  ssSyncPauseBtn();
  if(!ss.q && ss.state === 'playing') ssNewQ();   // 暂停若卡在换题间隙，恢复时补题
}
function ssSyncPauseBtn(){
  const b = $('ssPause');
  b.classList.toggle('paused', ss.paused);
  b.setAttribute('aria-pressed', String(ss.paused));
  b.querySelector('.pzLabel').textContent = ss.paused ? '继续' : '暂停';
  b.title = ss.paused ? '继续游戏（ESC）' : '暂停游戏（ESC）';
}
function openSeesaw(){
  sfx('tap');
  ss.active = true; ss.state = 'ready'; ss.paused = false; ss.q = null;
  ss.wrong = 0; ss.ok = 0; ss.stars = 0; ss.angle = 0; ss.tilt = 0;
  hideBubble(); clearPicks();
  SS.el.classList.add('on');
  SS.el.setAttribute('aria-hidden','false');
  SS.stars.innerHTML = Array.from({length:5},()=>starSvg(false)).join('');
  SS.ans.innerHTML = ''; SS.pop.innerHTML = '';
  ssSetLives(); ssUpdateHud();
  ssSyncPauseBtn();
  ssShowPanel('ready');
}
function closeSeesaw(){
  Snd.mood = 'calm'; sfx('tap');
  ss.active = false; ss.state = 'ready'; ss.paused = false; ss.q = null;
  SS.el.classList.remove('on');
  SS.el.setAttribute('aria-hidden','true');
  SS.panel.classList.remove('on');
  SS.ans.innerHTML = ''; SS.pop.innerHTML = '';
  ssSyncPauseBtn();
}

/* 输入：候选点选 / 键盘 1~4 选答案 / ESC 暂停 */
addEventListener('keydown', e=>{
  if(!ss.active) return;
  if(e.key === 'Escape'){
    if(ss.state === 'playing'){ ss.paused ? ssResume() : ssPause(); }
    else closeSeesaw();
    return;
  }
  if(ss.state !== 'playing' || ss.paused || !ss.q) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){ e.preventDefault(); const b = SS.ans.children[n-1]; if(b) b.click(); }
});
$('ssExit').addEventListener('click', closeSeesaw);
$('ssPause').addEventListener('click', ()=> ss.paused ? ssResume() : ssPause());
$('ssSnd').addEventListener('click', ()=> Snd.toggle());

/* ============ 秋千 · 荡高投掷游戏 ============ */
/* 真实物理：单摆（角度 a / 角速度 v，重力 sin 项 + 阻尼）+ 抛体投掷。
   荡高：按键给一个方向冲量，在谷点附近顺着摆动方向按才大幅增能（踩点）；
   投掷：脱手速度 = 当前向前有效线速度 + 投掷冲量，固定仰角抛出——
        在谷点（速度最大）投最远，在顶点（速度≈0）投几乎原地落下，时机即技巧。 */
const SWG     = 9.8;                    // 重力 m/s²
const SW_LEN  = 2.5;                    // 绳长 m（与视觉绳长一致）
const SW_K    = SWG/SW_LEN;             // 单摆系数 rad/s²
const SW_IMP  = .52;                    // 每次按键基础冲量 rad/s
const SW_DAMP = .05;                    // 阻尼（小，能量可累积）
const SW_AMAX   = 88*Math.PI/180;       // 物理上限角
const SW_DANGER = 66*Math.PI/180;       // 危险角（高于满分所需，留出贪心区）
const SW_THROW  = 2.5;                  // 投掷冲量 m/s（前上仰角抛出）
const SW_ANG    = 42*Math.PI/180;       // 抛射仰角
const SW_QTIME  = 5;                    // 戳球拯救 5 秒（宽松，降低难度）
const SW_DIST   = [1, 2, 3, 4, 5];       // 距离→星级阈值（米）：≥1m 一星 … ≥5m 五星
const SW_GRADE_TXT = ['哎呀，就近落地～','有点样子！','荡得不错！','又高又远！','飞出去啦！'];
const SW = {
  el:$('sw'), world:$('swWorld'), cam:$('swCam'), ticks:$('swTicks'),
  stage:$('swStage'), pivot:$('swPivot'), bear:$('swBear'), fly:$('swFly'),
  flag:$('swFlag'), flagTxt:document.querySelector('#swFlag b'), shadow:$('swShadow'),
  power:$('swPower'), fill:$('swFill'), dline:$('swDangerLine'),
  stars:$('swStars'), best:$('swBest'), throws:$('swThrows'),
  balls:$('swBalls'), ballBar:$('swBallBar'),
  ballFill:document.querySelector('#swBallBar .bar i'),
  pop:$('swPop'), warn:$('swWarn'), panel:$('swPanel'), card:$('swCard')
};
const sw = {
  active:false, state:'ready', paused:false,
  a:0, v:0, sign:1, best:0, stars:0, throws:0, lastDist:0, lastGrade:0,
  fly:null, balls:[], need:0, done:0, spawn:0, spawnT:0,
  tLeft:0, wait:0, camX:0, groundY:0, demo:false, winPending:false
};
let swPXM = 120;                        // 像素/米

/* 布局：按视口计算比例，摆放世界宽度 / 秋千尺寸 / 米数刻度 */
function swLayout(){
  swPXM = Math.max(80, Math.min(190, innerHeight*.16));
  sw.groundY = innerHeight*.78;
  const worldW = Math.round(58*swPXM);
  SW.world.style.width = worldW+'px';
  /* 秋千：座宽 ≈ 绳长/3.03（seat 素材 266×895），架子与书页同比例 */
  const seatW = SW_LEN*swPXM/3.03;
  const frameW = seatW/.19, frameH = frameW*1134/1400;
  SW.stage.style.width  = frameW+'px';
  SW.stage.style.height = frameH+'px';
  SW.stage.style.left   = (-frameW/2)+'px';
  SW.stage.style.top    = (sw.groundY - SW_LEN*swPXM - frameH*.075)+'px';
  /* 米数刻度：每 5 米一根 */
  SW.ticks.innerHTML = '';
  for(let m=5; m<=50; m+=5){
    const t = document.createElement('div');
    t.className = 'swTick'; t.dataset.m = m+'m';
    t.style.left = (m*swPXM-1.5)+'px';
    SW.ticks.appendChild(t);
  }
  /* 飞行玩偶 / 旗子的尺寸（侧坐小熊 248×224） */
  const bw = Math.round(seatW*.8);
  SW.fly.style.width = bw+'px'; SW.fly.style.height = Math.round(bw*224/248)+'px';
  SW.flag.style.height = Math.round(66*swPXM/124)+'px';
}
addEventListener('resize', ()=>{ if(sw.active) swLayout(); });

/* 踩点冲量：谷点附近（|a| 小）且顺着摆动方向按 → 满加成；乱按只有零头 */
function swPump(dir){
  if(sw.state !== 'playing' || sw.paused) return;
  const align = Math.sign(sw.v) === dir ? 1 : .32;
  const phase = Math.max(0, 1 - Math.abs(sw.a)/.5);
  const boost = .22 + .78*phase*align;
  sw.v += dir*SW_IMP*boost;
  sfx(boost > .6 ? 'pumpGood' : 'pump');
}

/* 掉落概率：危险角之上，角度越高概率越大（0 → .62） */
function swDangerP(amp){
  const t = (amp - SW_DANGER)/(SW_AMAX - SW_DANGER);
  return t <= 0 ? 0 : Math.min(.62, Math.pow(t, 1.15)*.62);
}

/* 投掷：玩偶脱离秋千，按当前向前有效速度抛出。
   出发点 x = 摆轴右侧固定偏移（与座板视觉位置一致，永远在秋千右侧脱手） */
function swThrowBear(){
  if(sw.state !== 'playing' || sw.paused) return;
  sw.throws++;
  swUpdateHud();
  const a = sw.a;
  const spd = Math.abs(sw.v)*SW_LEN*Math.cos(a) + SW_THROW;
  sw.fly = {
    x: SW_LEN*Math.sin(a),
    y: -(swHeightPiv() - SW_LEN*Math.cos(a)),
    vx: spd*Math.cos(SW_ANG), vy: -spd*Math.sin(SW_ANG),
    rot: 0, w: SW.bear.offsetWidth, h: SW.bear.offsetWidth*224/248, bounced:false
  };
  SW.bear.style.display = 'none';
  SW.fly.style.display = 'block';
  sfx('throw');
  sw.state = 'flying';
}
/* 横梁离地高度（m）：由布局尺寸反推，保持视觉与物理一致 */
function swHeightPiv(){
  const frameH = parseFloat(SW.stage.style.height)||0;
  return (sw.groundY - parseFloat(SW.stage.style.top||sw.groundY) - frameH*.075)/swPXM;
}

/* 飞行抛体 + 落地弹跳 */
function swStepFly(dt){
  const f = sw.fly;
  f.vy += SWG*dt;
  f.x += f.vx*dt;
  f.y += f.vy*dt;
  f.rot += f.vx*26*dt;
  if(f.y >= 0){
    f.y = 0;
    if(f.vy > 5 && !f.bounced){         // 高速落地弹跳一下再停
      f.bounced = true;
      f.vy = -f.vy*.32; f.vx *= .62;
      sfx('land');
    } else { swScore(); }
  }
}

/* 评级与结算：投出 1 米一星、2 米二星……5 米五星（就近落地保底 1 星） */
function swGrade(d){
  let g = 1;
  for(let i=0;i<SW_DIST.length;i++) if(d >= SW_DIST[i]) g = i+1;
  return g;
}
function swScore(){
  const dist = Math.max(0, sw.fly.x);
  const g = swGrade(dist);
  sw.lastDist = dist; sw.lastGrade = g;
  if(g >= sw.best){ sw.best = g; swSetStars(g); }   // 星 = 历史最好成绩
  SW.flag.style.display = 'block';
  SW.flag.style.left = (dist*swPXM-2)+'px';
  SW.flagTxt.textContent = dist.toFixed(1)+'m · '+g+'星';
  sfx('score');
  swPop(SW_GRADE_TXT[g-1]+'　'+dist.toFixed(1)+' 米', g>=4 ? 'gold' : '');
  swUpdateHud();                               // 最好成绩立即刷新
  sw.state = 'scored'; sw.wait = 1.15;
  sw.winPending = g >= 5;
}
/* 一掷结束：归位，自动补一只玩偶重新开始荡 */
function swResetRound(){
  sw.a = 0; sw.v = 0; sw.sign = 1;
  sw.fly = null; sw.winPending = false;
  SW.fly.style.display = 'none';
  SW.flag.style.display = 'none';
  SW.bear.style.display = '';
  sw.throws = sw.throws;              // 计数保留，HUD 在投掷时刷新
  swUpdateHud();
  sw.state = 'playing';
}

/* 戳球拯救 QTE：彩球陆陆续续冒出（每隔一小会儿一颗，可同屏共存），
   5 秒内戳够总数即拯救成功 */
function swStartRescue(){
  sw.state = 'rescue';
  sw.tLeft = SW_QTIME;
  const t = (Math.abs(sw.a) - SW_DANGER)/(SW_AMAX - SW_DANGER);
  sw.need = 3 + Math.round(2*t);
  sw.done = 0;
  sw.spawn = 0; sw.spawnT = 0;               // 已生成数 / 下一颗倒计时
  SW.balls.innerHTML = ''; sw.balls = [];
  SW.balls.classList.add('on'); SW.ballBar.classList.add('on');
  SW.ballFill.style.width = '100%';
  SW.bear.classList.add('help');
  swSpawnBall();                             // 第一颗立即出现
  sfx('warn');
}
/* 冒出一颗彩球（与已出现的球简单避让） */
function swSpawnBall(){
  if(sw.spawn >= sw.need) return;
  sw.spawn++;
  const b = document.createElement('button');
  b.className = 'swBall';
  let L, T, ok = false;
  for(let tr=0; tr<30 && !ok; tr++){
    L = 6 + Math.random()*82;
    T = 15 + Math.random()*52;
    ok = sw.balls.every(p =>
      Math.hypot(parseFloat(p.style.left)-L, parseFloat(p.style.top)-T) > 16);
  }
  b.style.left = L+'%'; b.style.top = T+'%';
  b.addEventListener('pointerdown', ev=>{
    ev.stopPropagation();
    swPopBall(b);
  });
  SW.balls.appendChild(b);
  sw.balls.push(b);
  SW.ballBar.querySelector('.lbl').textContent =
    `小熊快抓不住了！戳破彩球救它（${sw.done}/${sw.need}）`;
}
function swPopBall(b){
  if(sw.state !== 'rescue') return;
  const i = sw.balls.indexOf(b);
  if(i < 0) return;
  sw.balls.splice(i, 1);
  b.classList.add('gone');
  setTimeout(()=>b.remove(), 320);           // 仅清理动画节点
  sfx('bubble');
  sw.done++;
  SW.ballBar.querySelector('.lbl').textContent =
    `小熊快抓不住了！戳破彩球救它（${sw.done}/${sw.need}）`;
  if(sw.done >= sw.need) swRescueOk();
}
function swRescueOk(){
  sw.state = 'playing';
  SW.balls.classList.remove('on'); SW.ballBar.classList.remove('on');
  SW.bear.classList.remove('help');
  SW.balls.innerHTML = ''; sw.balls = [];
  sw.v *= .72;                                // 抓稳时泄一点能量，需要重新踩点
  sfx('right');
  swPop('小熊抓稳啦！');
}
function swRescueFail(){
  sw.state = 'dropping';
  SW.balls.classList.remove('on'); SW.ballBar.classList.remove('on');
  SW.balls.innerHTML = ''; sw.balls = [];
  SW.bear.classList.remove('help');
  SW.bear.style.display = 'none';
  const bw = Math.round(parseFloat(SW.fly.style.width)||80);
  const bh = Math.round(bw*224/248);
  SW.fly.style.width = bw+'px'; SW.fly.style.height = bh+'px';
  sw.fly = {
    x: SW_LEN*Math.sin(sw.a), y: -(swHeightPiv() - SW_LEN*Math.cos(sw.a)),
    vx: sw.v*SW_LEN*.4, vy: 0, rot: 0, w: bw, h: bh, bounced:false
  };
  SW.fly.style.display = 'block';
  sfx('drop');
  swPop('小熊掉下去啦……', true);
  sw.wait = .9;
}

/* 渲染：秋千摆动 / 玩偶水平化 / 影子 / 高度计 / 预警 / 相机
   角度约定：a>0 = 向前 = 画面右（小熊面朝方向）；pivot 视觉旋转取负号 */
function swRender(dt){
  const deg = sw.a*180/Math.PI;
  SW.pivot.style.transform = `rotate(${(-deg).toFixed(2)}deg)`;
  const wob = sw.state==='playing' ? Math.sin(clock*9)*2.2 : 0;
  SW.bear.style.transform = `rotate(${(deg+wob).toFixed(2)}deg)`;
  const c = Math.max(0, Math.cos(sw.a));
  SW.shadow.style.transform = `scale(${(0.5+0.5*c).toFixed(3)})`;
  SW.shadow.style.opacity = (0.32+0.4*c).toFixed(2);
  const amp = Math.min(1, Math.abs(sw.a)/SW_AMAX);
  SW.fill.style.height = (amp*100).toFixed(1)+'%';
  SW.power.classList.toggle('danger', Math.abs(sw.a) > SW_DANGER);
  SW.warn.classList.toggle('on', sw.state==='playing' && Math.abs(sw.a) > SW_DANGER*.9);
  $('swThrowBtn').classList.toggle('hot',
    sw.state==='playing' && Math.abs(sw.a) < .18 && Math.abs(sw.v) > 1.6);
  if(sw.fly && (sw.state==='flying' || sw.state==='dropping' || sw.state==='scored')){
    SW.fly.style.left = (sw.fly.x*swPXM - sw.fly.w/2)+'px';
    SW.fly.style.top  = (sw.groundY + sw.fly.y*swPXM - (sw.fly.h||sw.fly.w))+'px';
    SW.fly.style.transform = `rotate(${sw.fly.rot.toFixed(1)}deg)`;
  }
  let target = 0;
  if(sw.fly && sw.state !== 'playing' && sw.state !== 'rescue')
    target = Math.max(0, sw.fly.x*swPXM - innerWidth*.38);
  sw.camX += (target - sw.camX)*Math.min(1, dt*5);
  SW.cam.style.transform = `translateX(${-sw.camX.toFixed(1)}px)`;
}

/* 主更新：按状态推进 */
function updateSW(dt){
  if(sw.state === 'playing'){
    sw.v += (-SW_K*Math.sin(sw.a) - SW_DAMP*sw.v)*dt;
    sw.a += sw.v*dt;
    if(Math.abs(sw.a) > SW_AMAX){ sw.a = Math.sign(sw.a)*SW_AMAX; sw.v *= -.22; }
    const s = Math.sign(sw.v) || sw.sign;
    if(s !== sw.sign){                        // 摆动峰值：判定掉落风险
      sw.sign = s;
      const amp = Math.abs(sw.a);
      if(amp > SW_DANGER && !sw.demo && Math.random() < swDangerP(amp)){
        swStartRescue();
      }
    }
  } else if(sw.state === 'flying'){
    swStepFly(dt);
  } else if(sw.state === 'scored'){
    sw.wait -= dt;
    if(sw.wait <= 0){
      if(sw.winPending){ sw.state = 'win'; swSetStars(5); swShowPanel('win'); }
      else swResetRound();
    }
  } else if(sw.state === 'rescue'){
    sw.tLeft -= dt;
    SW.ballFill.style.width = (Math.max(0, sw.tLeft)/SW_QTIME*100).toFixed(1)+'%';
    sw.spawnT -= dt;
    if(sw.spawnT <= 0 && sw.spawn < sw.need){   // 彩球陆陆续续冒出
      swSpawnBall();
      sw.spawnT = .42;
    }
    if(sw.tLeft <= 0) swRescueFail();
  } else if(sw.state === 'dropping'){
    swStepFly(dt);
    sw.wait -= dt;
    if(sw.wait <= 0){ sw.state = 'over'; sfx('fail'); swShowPanel('over'); }
  }
  swRender(dt);
}

function swUpdateHud(){
  SW.best.innerHTML = sw.best ? `最好 <b>${sw.best} 星 · ${sw.lastDist.toFixed(1)}m</b>` : '最好 <b>—</b>';
  SW.throws.innerHTML = `第 <b>${sw.throws+1}</b> 掷`;
}
function swSetStars(n){
  const svgs = SW.stars.children;
  for(let i=0;i<5;i++){
    const lit = i < n;
    const was = svgs[i] && svgs[i].classList.contains('lit');
    if(svgs[i] && was !== lit) svgs[i].outerHTML = starSvg(lit);   // 只改变化的，保留点亮动画
  }
  sw.stars = n;
  if(n > 0 && sw.state !== 'win') sfx('star');
  bankSet('swing', n);                // 上报集星账本（取最高）
}
function swPop(txt, cls){
  const s = document.createElement('span');
  s.textContent = txt;
  if(cls) s.className = cls;
  s.style.left = (Math.random()*10-5).toFixed(0)+'%';
  SW.pop.appendChild(s);
  while(SW.pop.children.length > 3) SW.pop.firstChild.remove();
  setTimeout(()=>s.remove(), 980);
}
function swButtons(label){
  return `<div class="gBtns"><button class="gBtn" data-act="go">${label}</button>
    <button class="gBtn ghost" data-act="back">回到书页</button></div>`;
}
function swShowPanel(kind){
  sw.state = kind;
  SW.panel.classList.add('on');
  if(kind === 'ready'){
    SW.card.innerHTML = `
      <h2>秋千 · 荡高高，投得远</h2>
      <p>⬆⬇（或点下方按键）推秋千——<b>踩着摆动的节奏</b>按，越荡越高；乱按可没劲哦。<br>
      按 <b>投掷 / 空格</b> 把小熊抛出去，飞得越远星级越高：</p>
      <div class="swDist">
        <div><b>1星</b>≥1m</div><div><b>2星</b>≥2m</div><div><b>3星</b>≥3m</div>
        <div><b>4星</b>≥4m</div><div><b>5星</b>≥5m</div>
      </div>
      <p>荡过<b>危险角</b>小熊会抓不稳——快戳破彩球救它，5 秒戳不完就落地输啦。<br>
      就近落地也保底 1 星，投到 <b>5 米</b>集满五星获胜！</p>
      <p>↑↓ 荡秋千 · 空格投掷 · ESC 暂停</p>
      ${swButtons('出发！')}`;
  } else if(kind === 'over'){
    const bestTxt = sw.best ? `最好成绩 <b style="color:#e0912e">${sw.best} 星 · ${sw.lastDist.toFixed(1)} 米</b>` : '还没来得及投掷一次';
    SW.card.innerHTML = `
      <h2>哎呀，小熊摔了个屁股蹲儿！</h2>
      <p>共投掷 ${sw.throws} 次，${bestTxt}。<br>下次记得早点撒手～</p>
      ${bigStars(sw.best)}
      ${swButtons('再来一次')}`;
  } else {
    SW.card.innerHTML = `
      <h2>五颗星，投掷大师！</h2>
      <p>最远一掷 ${sw.lastDist.toFixed(1)} 米，小熊划出一道完美的弧线 ✦</p>
      ${bigStars(5)}
      <p>要再飞一次吗？</p>
      ${swButtons('再玩一次')}`;
  }
  SW.card.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.act === 'back') closeSwing(); else swStart();
  }));
}
function swStart(){
  sw.paused = false; swSyncPauseBtn();
  SW.panel.classList.remove('on');
  sw.state = 'playing';
  sw.a = 0; sw.v = 0; sw.sign = 1;
  sw.best = 0; sw.stars = 0; sw.throws = 0; sw.lastDist = 0; sw.lastGrade = 0;
  sw.fly = null; sw.winPending = false; sw.need = 0; sw.done = 0; sw.spawn = 0; sw.spawnT = 0;
  SW.fly.style.display = 'none'; SW.flag.style.display = 'none';
  SW.bear.style.display = ''; SW.bear.classList.remove('help');
  SW.stars.innerHTML = Array.from({length:5},()=>starSvg(false)).join('');
  SW.pop.innerHTML = '';
  SW.balls.classList.remove('on'); SW.ballBar.classList.remove('on');
  SW.balls.innerHTML = ''; sw.balls = [];
  swUpdateHud();
  Snd.mood = 'play'; sfx('start');
}
function swPause(){
  if(!sw.active || sw.state==='ready' || sw.state==='win' ||
     sw.state==='over' || sw.paused) return;
  sw.paused = true;
  sfx('tap');
  SW.card.innerHTML = `
    <h2>先歇一会儿</h2>
    <p>小熊坐在秋千上等你回来～<br>按 <b>ESC</b> 或点「继续」接着玩。</p>
    <div class="gPauseStat">已投 ${sw.throws} 次 · 最好 ${sw.best ? sw.best+' 星 · '+sw.lastDist.toFixed(1)+'m' : '—'} · ${sw.best} 颗星</div>
    <div class="gBtns">
      <button class="gBtn" data-act="resume">继续游戏</button>
      <button class="gBtn ghost" data-act="restart">重新开始</button>
      <button class="gBtn ghost" data-act="back">回到书页</button>
    </div>`;
  SW.card.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>{
    const a = b.dataset.act;
    if(a === 'resume') swResume();
    else if(a === 'restart') swStart();
    else closeSwing();
  }));
  SW.panel.classList.add('on');
  swSyncPauseBtn();
}
function swResume(){
  if(!sw.paused) return;
  sw.paused = false;
  SW.panel.classList.remove('on');
  sfx('tap');
  swSyncPauseBtn();
}
function swSyncPauseBtn(){
  const b = $('swPause');
  b.classList.toggle('paused', sw.paused);
  b.setAttribute('aria-pressed', String(sw.paused));
  b.querySelector('.pzLabel').textContent = sw.paused ? '继续' : '暂停';
  b.title = sw.paused ? '继续游戏（ESC）' : '暂停游戏（ESC）';
}
function openSwing(){
  sfx('tap');
  sw.active = true; sw.state = 'ready'; sw.paused = false;
  sw.a = 0; sw.v = 0; sw.best = 0; sw.stars = 0; sw.throws = 0; sw.fly = null;
  hideBubble(); clearPicks();
  SW.el.classList.add('on');
  SW.el.setAttribute('aria-hidden','false');
  swLayout();                                   // 显示后再量尺寸
  SW.stars.innerHTML = Array.from({length:5},()=>starSvg(false)).join('');
  SW.pop.innerHTML = '';
  SW.balls.classList.remove('on'); SW.ballBar.classList.remove('on');
  SW.balls.innerHTML = ''; sw.balls = [];
  swUpdateHud(); swSyncPauseBtn();
  swShowPanel('ready');
}
function closeSwing(){
  Snd.mood = 'calm'; sfx('tap');
  sw.active = false; sw.state = 'ready'; sw.paused = false;
  SW.el.classList.remove('on');
  SW.el.setAttribute('aria-hidden','true');
  SW.panel.classList.remove('on');
  SW.pop.innerHTML = '';
  SW.balls.classList.remove('on'); SW.ballBar.classList.remove('on');
  SW.balls.innerHTML = ''; sw.balls = [];
  swSyncPauseBtn();
}

/* 输入：键盘 ⬆⬇ 荡 / 空格投掷 / ESC 暂停 + 触屏按键 */
addEventListener('keydown', e=>{
  if(!sw.active) return;
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown',' ','w','s'].includes(k)) e.preventDefault();
  if(k === 'escape'){
    if(sw.state==='playing' || sw.state==='flying' || sw.state==='rescue' || sw.state==='scored'){
      sw.paused ? swResume() : swPause();
    } else closeSwing();
    return;
  }
  if(k === ' ' || k === 'enter'){
    if(sw.state==='playing') swThrowBear();
    else if(sw.state==='ready' || sw.state==='over' || sw.state==='win') swStart();
    return;
  }
  if(k === 'arrowup'   || k === 'w') swPump(1);
  else if(k === 'arrowdown' || k === 's') swPump(-1);
}, {passive:false});
$('swFwd').addEventListener('click', ()=>swPump(1));
$('swBack').addEventListener('click', ()=>swPump(-1));
$('swThrowBtn').addEventListener('click', ()=>swThrowBear());
$('swExit').addEventListener('click', closeSwing);
$('swPause').addEventListener('click', ()=> sw.paused ? swResume() : swPause());
$('swSnd').addEventListener('click', ()=> Snd.toggle());

    R.ssKey = ss.ok === 1;
    for(let i=0;i<4;i++){ ssNewQ(); ssAnswer(ss.q.ans); }
    R.ssStar1 = ss.ok === 5 && ss.stars === 1;
    ssNewQ();
    const w0 = ss.wrong;
    ssAnswer(ss.q.cands.find(v=>v !== ss.q.ans));
    R.ssWrong = ss.wrong === w0 + 1;
    ssNewQ(); ss.tLeft = .01; updateSS(1/60);
    R.ssTimeout = ss.wrong === w0 + 2;
    // 回归：超时后进入换题间隙(q=null)，连跑 60 帧不得重复扣血
    const wGap = ss.wrong;
    for(let i=0;i<60;i++) updateSS(1/60);
    R.ssGapNoLeak = ss.wrong === wGap;
    ssNewQ();
    for(let i=0;i<40;i++) updateSS(1/60);
    R.ssRecover = Math.abs(ss.angle - (ss.tilt/SS_WMAX)*SS_MAX_DEG) < 1.5;
    // 关键回归：答对回正到水平（tilt→0、angle→0），但累计次数 wrong 不减
    const wBeforeRight = ss.wrong;
    ssNewQ(); ssAnswer(ss.q.ans);
    R.ssRightKeepsWrong = ss.wrong === wBeforeRight;
    R.ssRightLevels = ss.tilt === 0;
    for(let i=0;i<60;i++) updateSS(1/60);
    R.ssRightFlat = Math.abs(ss.angle) < 1.5;
    ssNewQ();
    ss.wrong = SS_WMAX - 1; ss.tilt = SS_WMAX - 1; ssSetLives();
    ssAnswer(ss.q.cands.find(v=>v !== ss.q.ans));
    R.ssFail = ss.state === 'over';
    ssStart();
    for(let i=0;i<SS_GOAL;i++){ if(!ss.q) ssNewQ(); ssAnswer(ss.q.ans); }
    R.ssWin = ss.state === 'win';
    R.ssStars5 = ss.stars === 5;
    R.ssOk25 = ss.ok === 25;
    ssStart(); ssNewQ();
    $('ssPause').click();
    R.ssPaused = ss.paused && SS.panel.classList.contains('on');
    dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));
    R.ssResumed = !ss.paused && !SS.panel.classList.contains('on');
    closeSeesaw();
    R.ssClosed = !SS.el.classList.contains('on');

    // 10. 秋千 · 荡高投掷：踩点物理 / 投掷抛体 / 评级 / 最好成绩 / QTE / 暂停
    openSwing();
    R.swOpen = SW.el.classList.contains('on');
    R.swReady = sw.state === 'ready' && SW.panel.classList.contains('on');
    swStart();
    // 踩点：顺着摆动方向、近谷点按 → 大增能；逆着按 → 只剩零头
    sw.a = .3; sw.v = 2.2;
    const E0g = .5*sw.v*sw.v;
    swPump(1);
    R.swPumpGood = +(.5*sw.v*sw.v - E0g).toFixed(3);
    sw.a = .3; sw.v = -2.2;
    const E0b = .5*sw.v*sw.v;
    swPump(1);
    R.swPumpBad = +(.5*sw.v*sw.v - E0b).toFixed(3);
    R.swPumpRatio = R.swPumpGood > R.swPumpBad*2.5;
    // 投掷：谷点（速度最大）投远于顶点（速度≈0）投——时机即技巧
    sw.state = 'playing';
    sw.a = 1.2; sw.v = 0; swThrowBear();          // 顶点投：几乎原地落下
    R.swFlying = sw.state === 'flying';
    let fn = 0;
    while(sw.state === 'flying' && fn++ < 400) updateSW(1/60);
    R.swDist2 = +sw.lastDist.toFixed(2);
    let sn = 0;
    while(sw.state === 'scored' && sn++ < 200) updateSW(1/60);   // 等展示结束归位
    R.swReset = sw.state === 'playing' && sw.throws === 1;
    sw.a = 0; sw.v = 2.0; swThrowBear();          // 谷点投：距离明显更远
    fn = 0; while(sw.state === 'flying' && fn++ < 400) updateSW(1/60);
    R.swDist1 = +sw.lastDist.toFixed(2);
    R.swGrade1 = sw.lastGrade;
    sn = 0; while(sw.state === 'scored' && sn++ < 200) updateSW(1/60);
    R.swTiming = R.swDist1 > R.swDist2;
    R.swBestMon = sw.best >= sw.lastGrade;
    R.swGradeRange = sw.lastGrade >= 1 && sw.lastGrade <= 5;
    R.swFiveReachable = R.swDist1 >= 5;        // 真实谷点投掷可达 5 星阈值
    // 新评级映射：1m一星 2m二星 3m三星 4m四星 5m五星
    R.swGradeMap = swGrade(0.5)===1 && swGrade(1)===1 && swGrade(2)===2 &&
                   swGrade(3)===3 && swGrade(4)===4 && swGrade(5)===5 && swGrade(9)===5;
    // 通关：构造一次 5 星投掷
    sw.state = 'playing'; sw.best = 4;
    sw.fly = {x:12.6, y:-1, vx:0, vy:0, rot:0, w:80, bounced:true};
    swScore();
    R.swGrade5 = sw.lastGrade === 5;
    sn = 0; while(sw.state === 'scored' && sn++ < 200) updateSW(1/60);
    R.swWin = sw.state === 'win' && sw.stars === 5;
    // QTE：第一颗球立即出现，剩余陆陆续续冒出可共存；戳完 → 拯救；超时 → 坕落
    swStart();
    sw.a = 1.28; sw.v = 0; swRender(1/60);
    swStartRescue();
    R.swBallsN = sw.need >= 3 && sw.balls.length === 1;      // 开局只出现第一颗
    R.swRescue = sw.state === 'rescue';
    let rn = 0;
    while(sw.state === 'rescue' && sw.spawn < sw.need && rn++ < 400) updateSW(1/60);
    R.swSpawnAll = sw.spawn === sw.need && sw.balls.length === sw.need;   // 陆续生成可共存
    [...sw.balls].forEach(b=>swPopBall(b));
    R.swSaved = sw.state === 'playing';
    swStartRescue();
    const bn = sw.need;
    fn = 0;
    while(sw.state === 'rescue' && fn++ < 420) updateSW(1/60);    // 不戳球，5 秒耗尽
    fn = 0;
    while(sw.state === 'dropping' && fn++ < 120) updateSW(1/60);  // 坠落动画
    R.swRescueFail = sw.state === 'over';
    R.swBallsN2 = bn >= 3;
    R.swDangerP = swDangerP(SW_DANGER + .01) > 0 &&
                  swDangerP(SW_AMAX) > swDangerP(SW_DANGER + .1);
    // 暂停：HUD 按钮 / ESC / 冻结
    swStart();
    sw.a = .5; sw.v = 1.4;
    for(let i=0;i<30;i++) updateSW(1/60);
    const swA = sw.a;
    $('swPause').click();
    R.swPaused = sw.paused && SW.panel.classList.contains('on');
    tick(40, 1/60);
    R.swFrozen = Math.abs(sw.a - swA) < 1e-6;
    dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));
    R.swResumed = !sw.paused && !SW.panel.classList.contains('on');
    closeSwing();
    R.swClosed = !SW.el.classList.contains('on');

    // 11. 集星账本：三游戏各取最高 / 合计 15 / 徽标 / 满星蜂蜜对话 / 提示文案
    bankReset();
    R.bankStart = bankTotal()===0 && $('sbCount').textContent==='0';
    bankSet('carousel',3); bankSet('carousel',2);          // 低分不回退
    R.bankMaxOnly = bank.carousel===3 && bankTotal()===3;
    bankSet('seesaw',5);
    R.bankSum = bankTotal()===8 && $('sbCount').textContent==='8';
    R.bankBarOn = $('sbBar').querySelectorAll('u.on').length===8;
    R.bankDetail = $('sbDetail').querySelectorAll('.sbRow').length===3;
    R.bankNotFull = !bankFull() && !$('starBank').classList.contains('full');
    bankSet('carousel',5);                                  // 补满木马（3→5 取最高）
    bankSet('swing',5);
    R.bankFull = bankFull() && bankTotal()===15 && $('starBank').classList.contains('full');
    R.bankBar15 = $('sbBar').querySelectorAll('u.on').length===15 && $('sbBar').children.length===15;
    closeAll(); open('bearA');                              // 集满 → 蜂蜜奖励对话
    R.honeyText = bTxt.textContent === HONEY_LINE;
    R.honeyTag  = bTag.textContent === '小熊 · 惊喜';
    R.honeyGift = bubble.classList.contains('hasGift');
    bankReset(); closeAll(); open('bearA');                 // 未满星 → 普通对话
    R.bearNormal = bTxt.textContent === DIALOG.bearA.lines[0] && !bubble.classList.contains('hasGift');
    closeAll();
    R.hintText = $('hint').textContent;
    R.topHud = $('topHud').contains($('sndBtn')) && $('topHud').contains($('starBank'));

    // 12. 三套独立布局 + 视图缩放控件 + 零重排渲染
    R.gLay = !!GLAY && GLAY.obs > 0 &&
             laneY(2) < laneY(1) && laneY(1) < laneY(0) &&
             GLAY.step >= GLAY.obs * .7 && GLAY.midY > 0;
    R.gModes = (()=>{          /* 桌面/竖屏/横屏三套；竖屏层距更紧凑、不叠层、不超列距 */
      const d = gameLayoutParams(1280, 800, false);
      const p = gameLayoutParams(390, 844, true);
      const l = gameLayoutParams(844, 390, true);
      return d.mode === 'desktop' && p.mode === 'portrait' && l.mode === 'landscape' &&
             (p.step/p.obs) < (l.step/l.obs) &&            // 竖屏三层明显更靠近
             p.obs < 390*.17 && l.obs < 844*.17 &&          // 点心不超过列距，横向不重叠
             p.step >= p.obs && l.step > l.obs &&           // 垂直方向都绝不叠层
             Math.abs(p.midY/844 - l.midY/390) > .02;       // 三层纵向位置也各自独立设计
    })();
    R.gLayMono = (()=>{        /* 任意 (obs,step,midY) 下三层单调且相邻间距 = step */
      const s0 = GLAY.obs, t0 = GLAY.step, m0 = GLAY.midY;
      GLAY.obs = 60; GLAY.step = 72; GLAY.midY = 400;
      const ok = laneY(2) < laneY(1) && laneY(1) < laneY(0) &&
                 Math.abs(laneY(0) - laneY(1) - 72) < 1e-9 &&
                 Math.abs(laneY(1) - laneY(2) - 72) < 1e-9;
      GLAY.obs = s0; GLAY.step = t0; GLAY.midY = m0;
      return ok;
    })();
    R.gObsNoLayout = (()=>{    /* 障碍 left/top 生成后不再被 posObs 改写（零强制重排） */
      const o = makeObs(1, 'cake');
      const p = o.pieces[0];
      const l0 = p.el.style.left, t0 = p.el.style.top;
      o.z = .5; posObs(o); o.z = .8; posObs(o); o.z = 1.05; posObs(o);
      const ok = !!l0 && !!t0 && p.el.style.left === l0 && p.el.style.top === t0 &&
                 /translateY/.test(p.el.style.transform);
      dropObs(o);
      return ok;
    })();
    R.gObsPx = ($('game').style.getPropertyValue('--obsPx') || '').length > 2;
    R.gNoFullApi = !new RegExp('request'+'Fullscreen|orientation'+'\\.lock').test(
      [...document.querySelectorAll('script:not([src])')].map(s=>s.textContent).join(''));
    R.gStageNoLongTrans = (()=>{  /* #stage 不再有 1s+ transform 过渡 / 超大 will-change */
      const cs = getComputedStyle(stage);
      const dur = parseFloat(cs.transitionDuration) || 0;
      return dur <= .7 && !/transform/.test(cs.transitionProperty) &&
             cs.willChange !== 'transform';
    })();
    const f0 = curFit;
    $('vPlus').click();
    R.viewZoomUp  = curFit > f0 && view.zoom > 1;
    $('vReset').click();
    R.viewReset   = view.zoom === 1 && Math.abs(curFit - f0) < 1e-9 &&
                    view.panX === 0 && view.panY === 0;
    R.viewBar     = !!$('viewBar') && !!$('vRot') &&
                    parseFloat(stage.style.getPropertyValue('--fit')) > 0;
    R.vRotGuide   = (()=>{      /* 点横屏按钮：只出引导文案，不调全屏/锁方向，不报错 */
      try{ $('vRot').click(); }catch(e){ return false; }
      return !document.fullscreenElement &&
             /方向锁定/.test($('rotateTip').textContent);
    })();

    document.title = 'SELFTEST ' + JSON.stringify(R);
    const d = document.createElement('pre');
    d.id = 'selftestOut'; d.textContent = document.title;
    document.body.appendChild(d);
  })();
}

})();
</script>
